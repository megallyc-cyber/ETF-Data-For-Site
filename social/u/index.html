<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member — Licentia</title>
<meta name="description" content="A Licentia member: what they hold, what they have posted, and how they invest for income.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/assets/bird.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/pro.css">
<style>
  :root{
    --paper:#F4F1E8; --paper-raised:#FBF9F5; --white:#FFFFFF;
    --ink:#1C2230; --ink-soft:#4A5262; --ink-faint:#8A9099;
    --line:rgba(28,34,48,0.13); --line-strong:rgba(28,34,48,0.26);
    --ember:#FF6B35; --ember-deep:#D4501F; --teal:#2E7D6B;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink);
    font-family:'Inter',ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  main{max-width:820px; margin:0 auto; padding:0 26px 90px;}

  nav{display:flex; align-items:center; justify-content:space-between; gap:28px;
    padding:15px 30px; position:sticky; top:0; z-index:40; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(242,239,233,0.97) 0%, rgba(242,239,233,0.86) 100%);
    -webkit-backdrop-filter:saturate(150%) blur(14px);
    backdrop-filter:saturate(150%) blur(14px);
    border-bottom:1px solid var(--line);}
  nav .brand{font-family:'Space Grotesk',ui-sans-serif,sans-serif; font-weight:700;
    font-size:19px; letter-spacing:-0.02em; color:var(--ink); text-decoration:none;
    display:inline-flex; align-items:center;}
  nav .brand img{margin-left:8px; vertical-align:-1px;}
  .navlinks{display:flex; gap:26px; flex-wrap:wrap; align-items:center;}
  .navlinks a{font-family:'Inter',ui-sans-serif,sans-serif; font-size:14px;
    padding:5px 0; text-decoration:none; color:var(--ink-soft); white-space:nowrap;
    position:relative; transition:color .16s;}
  .navlinks a::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    border-radius:2px; background:var(--ember); transform:scaleX(0);
    transform-origin:left center; transition:transform .2s ease;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks a:hover::after{transform:scaleX(0.45);}
  .navlinks a.active{color:var(--ink); font-weight:500;}
  .navlinks a.active::after{transform:scaleX(1);}
  @media(max-width:820px){
    nav{padding:12px 16px; gap:16px;}
    .navlinks{gap:15px;}
    .navlinks a{font-size:12.5px;}
  }

  .back{display:inline-block; margin:24px 0 14px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint); text-decoration:none;}
  .back:hover{color:var(--ink);}

  .who{display:grid; grid-template-columns:82px minmax(0,1fr); gap:18px;
    background:var(--white); border:1px solid var(--line); border-radius:15px;
    padding:22px 24px; margin-bottom:18px;
    box-shadow:0 2px 4px rgba(28,34,48,0.05), 0 18px 34px -24px rgba(28,34,48,0.4);}
  .who-face{width:82px; height:82px; border-radius:50%; overflow:hidden;
    background:var(--paper-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:32px; color:var(--ink-soft);}
  .who-face img{width:100%; height:100%; object-fit:cover; display:block;}
  .who-name{font-family:'Fraunces',serif; font-size:26px; line-height:1.2;}
  .who-handle{font-size:14px; color:var(--ink-faint); margin-top:2px;}
  .who-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .who-bio{font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin-top:11px;}
  .who-stats{display:flex; gap:20px; margin-top:13px; flex-wrap:wrap;}
  .who-stat b{font-family:'IBM Plex Mono',monospace; font-size:15px;}
  .who-stat span{font-size:12px; color:var(--ink-faint); margin-left:5px;}

  .badge{display:inline-flex; align-items:center; padding:3px 9px; border-radius:100px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em;
    text-transform:uppercase; white-space:nowrap;}
  .badge.size{background:rgba(28,34,48,0.06); color:var(--ink-soft);
    border:1px solid var(--line-strong);}
  .badge.tier-platinum{background:linear-gradient(115deg,#6E747E,#E6EAEF,#6E747E);
    color:#1C2230; border:1px solid rgba(110,116,126,0.5);}
  .badge.tier-platinum-plus{background:linear-gradient(115deg,#3E4756,#D5DBE4,#3E4756);
    color:#141A25; border:1px solid rgba(62,71,86,0.5);}
  .badge.tier-generational{background:linear-gradient(115deg,#8C6B1F,#E9D6A8,#8C6B1F);
    color:#2A2008; border:1px solid rgba(140,107,31,0.5);}
  .badge.tier-diamond{background:linear-gradient(115deg,#5B7FA6,#EAF3FB,#5B7FA6);
    color:#10202F; border:1px solid rgba(91,127,166,0.5);}
  .badge.pro{background:rgba(255,107,53,0.12); color:var(--ember-deep);
    border:1px solid rgba(255,107,53,0.35);}

  .panel{background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:19px 21px; margin-bottom:16px;}
  .panel-t{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.13em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:13px;}
  .hold{display:grid; grid-template-columns:minmax(0,1fr) 96px 56px; align-items:center;
    gap:11px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .hold:last-child{border-bottom:none;}
  .hold a{text-decoration:none;}
  .hold a:hover{text-decoration:underline;}
  .hold-bar{height:5px; border-radius:3px; background:rgba(28,34,48,0.07); overflow:hidden;}
  .hold-bar i{display:block; height:100%; border-radius:3px;
    background:linear-gradient(90deg, var(--ink), #4A6FA5);}
  .hold-pct{font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right;
    color:var(--ink-soft);}

  .post{background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;}
  .post .b{font-size:14.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere;}
  .post .m{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);
    margin-top:8px;}
  .quiet{background:var(--white); border:1px dashed var(--line-strong); border-radius:13px;
    padding:30px 22px; text-align:center; color:var(--ink-soft); font-size:14.5px;}

  .edit-row{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap;}
  .edit-row input{padding:8px 11px; border-radius:8px; font:inherit; font-size:14px;
    border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
    outline:none;}
  .edit-row input:focus{border-color:var(--ink);}
  .edit-row input.handle{width:180px;}
  .edit-row input.bio{flex:1; min-width:220px;}
  .edit-go{padding:8px 16px; border-radius:100px; cursor:pointer; font:inherit; font-size:13.5px;
    background:var(--ink); color:var(--paper); border:1px solid var(--ink);}
  .edit-go:hover{filter:brightness(1.2);}
  .edit-note{font-size:12.5px; color:var(--ink-faint); margin-top:7px;}
  .edit-note.bad{color:var(--ember-deep);}
</style>
</head>
<body>

<nav>
  <a class="brand" href="/">Licentia<img src="/assets/bird.svg" alt="" width="24" height="15"></a>
  <div class="navlinks">
    <a href="/">Home</a>
    <a class="active" href="/social">Social</a>
    <a href="/learn">Learn</a>
    <a href="/funds">Funds</a>
    <a href="/compare">Comparison Tool</a>
    <a href="/portfolio-builder">Portfolio Builder</a>
    <a href="/portfolio">My Portfolio</a>
    <a href="/backtest">Backtesting</a>
    <a href="/membership">Membership</a>
    <a href="/account">My Account</a>
  </div>
</nav>

<main>
  <a class="back" href="/social">&larr; Back to the feed</a>
  <div id="who"></div>
  <div id="holdings"></div>
  <div id="posts"></div>
</main>
<script type="module">

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

async function client(){
  for (let i = 0; i < 100; i++){
    if (window.LICENTIA_ANON) break;
    await new Promise(function(r){ setTimeout(r, 100); });
  }
  if (!window.LICENTIA_ANON) throw new Error('no key');
  return createClient('https://sopzbiuwakowbuqgwpmg.supabase.co', window.LICENTIA_ANON);
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function when(iso){
  const mins = Math.round((new Date() - new Date(iso)) / 60000);
  if (mins < 60) return Math.max(mins,1) + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  return new Date(iso).toLocaleDateString('en-CA', {month:'short', day:'numeric', year:'numeric'});
}

const TIER_LABEL = {pro:'Pro', platinum:'Platinum', 'platinum-plus':'Platinum Plus',
                    generational:'Generational', diamond:'Diamond'};

// Badges are earned, not typed: tier comes from billing, the size band is
// written by the portfolio page from real holdings.
function badges(w){
  let out = '';
  if (w.tier){
    const key = String(w.tier).toLowerCase().replace(/ /g,'-');
    out += '<span class="badge ' + (key === 'pro' ? 'pro' : 'tier-' + key) + '">'
        + esc(TIER_LABEL[key] || w.tier) + '</span>';
  }
  if (w.size_band){
    out += '<span class="badge size">Portfolio ' + esc(String(w.size_band).toUpperCase())
        + '+</span>';
  }
  if (w.is_official) out += '<span class="badge pro">Licentia</span>';
  return out;
}

(async function(){
  const handle = new URLSearchParams(location.search).get('h');
  const whoEl = document.getElementById('who');
  if (!handle){
    whoEl.innerHTML = '<div class="quiet">No member named.</div>';
    return;
  }

  let sb;
  try { sb = await client(); }
  catch (e){ whoEl.innerHTML = '<div class="quiet">Could not load. Reload the page.</div>'; return; }

  const r = await sb.from('profiles_public').select('*').eq('handle', handle).single();
  if (r.error || !r.data){
    whoEl.innerHTML = '<div class="quiet">No member with that name.</div>';
    return;
  }
  const w = r.data;
  const name = w.full_name || w.handle;
  document.title = name + ' — Licentia';

  whoEl.innerHTML = '<div class="who">'
    + '<div class="who-face">'
      + (w.avatar_url ? '<img src="' + esc(w.avatar_url) + '" alt="">'
                      : esc(name.trim().slice(0,1).toUpperCase()))
    + '</div><div>'
    + '<div class="who-name">' + esc(name) + '</div>'
    + '<div class="who-handle">@' + esc(w.handle) + '</div>'
    + '<div class="who-badges">' + badges(w) + '</div>'
    + (w.bio ? '<p class="who-bio">' + esc(w.bio) + '</p>' : '')
    + '<div class="who-stats">'
      + '<div class="who-stat"><b>' + (w.post_count || 0) + '</b><span>posts</span></div>'
      + '<div class="who-stat"><b>' + (w.follower_count || 0) + '</b><span>followers</span></div>'
      + '<div class="who-stat"><b>' + when(w.signed_up).replace(' ago','') + '</b><span>joined</span></div>'
    + '</div></div></div>';

  // Your own profile gets the controls. Everyone else's is read only, which
  // is enforced by the database too, not just by hiding the form.
  const me = await sb.auth.getSession();
  const myId = me.data.session ? me.data.session.user.id : null;
  if (myId === w.id){
    const box = document.createElement('div');
    box.className = 'panel';
    box.innerHTML = '<div class="panel-t">Your profile</div>'
      + '<div class="edit-row">'
      + '<span style="color:var(--ink-faint)">@</span>'
      + '<input class="handle" id="ed-handle" maxlength="20" value="' + esc(w.handle) + '">'
      + '<input class="bio" id="ed-bio" maxlength="300" placeholder="A line about how you invest"'
      + ' value="' + esc(w.bio || '') + '">'
      + '<button class="edit-go" id="ed-save" type="button">Save</button>'
      + '</div>'
      + '<div class="edit-note" id="ed-note">Three to twenty letters, numbers or '
      + 'underscores. Changing your handle changes the address of this page.</div>';
    whoEl.appendChild(box);

    document.getElementById('ed-save').addEventListener('click', async function(){
      const note = document.getElementById('ed-note');
      const btn = document.getElementById('ed-save');
      const h = document.getElementById('ed-handle').value.trim().toLowerCase();
      const b = document.getElementById('ed-bio').value;
      btn.disabled = true;
      note.className = 'edit-note';
      note.textContent = 'Saving…';

      // the database does the checking, so its refusal is the honest message
      if (h && h !== w.handle){
        const r = await sb.rpc('set_handle', {new_handle: h});
        if (r.error){
          note.className = 'edit-note bad';
          note.textContent = r.error.message;
          btn.disabled = false;
          return;
        }
      }
      const rb = await sb.rpc('set_bio', {new_bio: b});
      btn.disabled = false;
      if (rb.error){
        note.className = 'edit-note bad';
        note.textContent = rb.error.message;
        return;
      }
      // the address changes with the handle, so go to the new one
      location.href = '/social/u/?h=' + encodeURIComponent(h || w.handle);
    });
  }

  // Holdings, as percentages. A member has to have chosen to publish these;
  // the amounts are never shown, only the shape of the portfolio.
  const holdEl = document.getElementById('holdings');
  const mix = await sb.from('public_holdings').select('ticker,weight')
    .eq('user_id', w.id).order('weight', {ascending:false}).limit(15);
  if (!mix.error && mix.data && mix.data.length){
    const top = mix.data[0].weight || 1;
    holdEl.innerHTML = '<div class="panel"><div class="panel-t">What they hold</div>'
      + mix.data.map(function(h){
          return '<div class="hold">'
            + '<a href="/fund/' + encodeURIComponent(h.ticker) + '"><b>' + esc(h.ticker) + '</b></a>'
            + '<span class="hold-bar"><i style="width:' + Math.max((h.weight/top)*100, 3) + '%"></i></span>'
            + '<span class="hold-pct">' + Number(h.weight).toFixed(1) + '%</span>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  const postsEl = document.getElementById('posts');
  const posts = await sb.from('posts')
    .select('id,body,kind,ticker,created_at,like_count')
    .eq('author_id', w.id).is('removed_at', null).eq('visibility','public')
    .order('created_at', {ascending:false}).limit(20);
  if (posts.error || !posts.data || !posts.data.length){
    postsEl.innerHTML = '<div class="quiet">Nothing posted yet.</div>';
    return;
  }
  postsEl.innerHTML = '<div class="panel-t" style="margin:22px 0 12px">Posts</div>'
    + posts.data.map(function(p){
        return '<article class="post"><div class="b">' + esc(p.body) + '</div>'
          + '<div class="m">' + when(p.created_at)
          + (p.ticker ? ' &middot; ' + esc(p.ticker) : '')
          + (p.like_count ? ' &middot; ' + p.like_count + ' likes' : '')
          + '</div></article>';
      }).join('');
})();

</script>

<script src="/assets/pro.js"></script>
</body>
</html>
