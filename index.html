<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licentia — Income Investing, Understood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>  :root{
    --paper:#EDEEE7;
    --paper-raised:#F5F5F0;
    --ink:#152019;
    --ink-soft:#3F4A42;
    --ink-faint:#6E766E;
    --gold:#C89B3C;
    --gold-deep:#8F6B22;
    --teal:#1F5C4E;
    --teal-deep:#123D33;
    --rust:#A6452C;
    --line:rgba(21,32,25,0.14);
    --line-strong:rgba(21,32,25,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 48px;
    background:rgba(237,238,231,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:-0.01em;
         color:inherit; text-decoration:none; cursor:pointer;}
  .brand:hover{opacity:.75;}
  .brand .dot{color:var(--gold-deep);}
  .navlinks{display:flex; gap:32px; font-size:14px; color:var(--ink-soft);}
  .navlinks a{cursor:pointer; transition:color .2s;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks a.active{color:var(--gold-deep); font-weight:500;}

  /* --- cinematic hero: three beats revealed by scroll position, so the
     reader sets the pace and nothing moves while they are reading. */
  .hero-track{ height:calc(100vh + 260px); position:relative; }
  .landing-foot{ text-align:center; padding:0 24px 46px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); }
  .hero-stage{ position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 24px; overflow:hidden; }
  /* Only one line is readable at a time: the outgoing beat is hidden outright
     rather than fading slowly, so two never sit on top of each other. */
  .beat{ position:absolute; max-width:900px; padding:0 24px;
    opacity:0; visibility:hidden; transform:translateY(22px);
    transition:opacity .3s ease, transform .45s cubic-bezier(.2,.7,.3,1), visibility 0s linear .3s;
    pointer-events:none; }
  .beat.on{ opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
    transition:opacity .45s ease .06s, transform .5s cubic-bezier(.2,.7,.3,1) .06s, visibility 0s; }
  .beat.gone{ opacity:0; visibility:hidden; transform:translateY(-22px); }
  .beat-1 h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(36px,6.2vw,68px);
    line-height:1.08; letter-spacing:-0.02em; margin:0; }
  .beat-1 .rule{ width:64px; height:1px; background:var(--gold-deep); margin:34px auto 0; opacity:.8; }
  .beat-2 h2{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(30px,5vw,52px);
    line-height:1.16; letter-spacing:-0.015em; margin:0; }
  .beat-2 em{ font-style:italic; color:var(--gold-deep); }
  .beat-2 .lede{ font-size:17.5px; color:var(--ink-soft); max-width:48ch; margin:26px auto 0; }
  .beat-3 .choose{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:28px; }
  .beat-3 .btns{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .beat-dots{ position:absolute; bottom:46px; display:flex; gap:9px; }
  .beat-dots i{ width:6px; height:6px; border-radius:50%; background:var(--line-strong);
    transition:background .3s, transform .3s; }
  .beat-dots i.on{ background:var(--gold-deep); transform:scale(1.35); }
  .hero-cue{ position:absolute; bottom:24px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-faint); transition:opacity .4s; }
  /* reduced motion: show the whole message at once rather than a hero that never resolves */
  @media (prefers-reduced-motion: reduce){
    .hero-track{height:auto;}
    .hero-stage{position:static; height:auto; padding:80px 24px; gap:36px;}
    .beat{position:static; opacity:1; transform:none; transition:none;}
    .beat-dots, .hero-cue{display:none;} }
  @media (max-width:640px){
    .hero-track{height:calc(100vh + 220px);}
    .beat-3 .btns{flex-direction:column; align-items:stretch;}
    .btn-ghost{margin-left:0;} }

  .hero{
    min-height:78vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:80px 24px 60px;
    max-width:800px; margin:0 auto;
  }
  .hero-kicker{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--teal-deep); margin-bottom:26px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:clamp(34px,5.6vw,56px);
    line-height:1.14; letter-spacing:-0.015em; margin-bottom:28px;
  }
  h1 em{font-style:italic; color:var(--gold-deep);}
  .hero p.lede{font-size:18px; color:var(--ink-soft); max-width:46ch; margin:0 auto 40px;}
  .btn{
    font-family:'Inter',sans-serif; font-weight:500; font-size:15px;
    padding:14px 28px; border-radius:2px; cursor:pointer; border:1px solid transparent;
    transition:all .2s; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-ghost{border-color:var(--line-strong); color:var(--ink); margin-left:12px;}
  .btn-ghost:hover{border-color:var(--ink); background:var(--paper-raised);}
  .scroll-cue{
    margin-top:56px; display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--ink-faint); font-size:12px; font-family:'IBM Plex Mono',monospace;
    animation:bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}

  .path-intro{
    text-align:center; padding:90px 24px 20px; max-width:640px; margin:0 auto;
  }
  .path-intro .section-tag{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--rust);
    text-transform:uppercase; letter-spacing:0.1em; margin-bottom:16px;
  }
  .path-intro h2{
    font-family:'Fraunces',serif; font-weight:500; font-size:clamp(26px,3.4vw,34px);
    letter-spacing:-0.01em; margin-bottom:16px;
  }
  .path-intro p{color:var(--ink-soft); font-size:16px;}

  .path-wrap{
    position:relative; max-width:960px; margin:0 auto; padding:40px 24px 80px;
  }
  .path-svg{
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  .path-line{
    fill:none; stroke:var(--line-strong); stroke-width:2; stroke-dasharray:6 8;
  }
  .path-line-progress{
    fill:none; stroke:var(--gold-deep); stroke-width:2.5;
  }
  .stop{
    position:relative; z-index:1;
    display:grid; grid-template-columns:1fr; gap:18px;
    width:46%; margin-bottom:120px;
    opacity:0; transform:translateY(30px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .stop.in{opacity:1; transform:translateY(0);}
  .stop.right{margin-left:54%;}
  .stop.left{margin-right:54%;}
  .stop-node{
    position:absolute; top:6px; width:14px; height:14px; border-radius:50%;
    background:var(--paper); border:2.5px solid var(--line-strong);
    transition:background .4s ease, border-color .4s ease;
  }
  .stop.left .stop-node{ right:-38px; }
  .stop.right .stop-node{ left:-38px; }
  .stop.in .stop-node{ background:var(--gold); border-color:var(--gold-deep); }
  .stop-num{font-family:'IBM Plex Mono',monospace; color:var(--gold-deep); font-size:13px; margin-bottom:6px;}
  .stop h3{font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin-bottom:10px;}
  .stop p{color:var(--ink-soft); font-size:15px;}
  .stop-visual{
    background:var(--paper-raised); border:1px solid var(--line); padding:20px;
    display:flex; align-items:center; justify-content:center; min-height:100px; margin-top:8px;
  }
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .bar-track{flex:1; height:8px; background:var(--line); position:relative; border-radius:1px;}
  .bar-fill{height:100%; position:absolute; left:0; top:0;}
  .bar-label{width:110px; color:var(--ink-faint);}

  @media (max-width:760px){
    .stop, .stop.right, .stop.left{width:100%; margin-left:0; margin-right:0; padding-left:34px;}
    .stop.left .stop-node, .stop.right .stop-node{left:0; right:auto;}
    .path-svg{display:none;}
  }

  .workbench-shell{
    background:var(--ink); color:var(--paper); padding:90px 48px; margin-top:20px;
  }
  .workbench-inner{max-width:1160px; margin:0 auto;}
  .workbench-shell .section-tag{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px;}
  .workbench-shell h2{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,3.4vw,38px); color:var(--paper); margin-bottom:16px; letter-spacing:-0.01em;}
  .workbench-shell .section-head{max-width:640px; margin-bottom:56px;}
  .workbench-shell .section-head p{color:rgba(237,238,231,0.7); font-size:16.5px;}

  .picker-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}
  .slot{
    background:rgba(237,238,231,0.05); border:1px solid rgba(237,238,231,0.18);
    padding:16px 18px; min-width:220px; flex:1;
  }
  .slot label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(237,238,231,0.5); display:block; margin-bottom:8px;}
  select{
    width:100%; background:transparent; border:none; color:var(--paper);
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500;
    padding:4px 0; cursor:pointer;
  }
  select option{background:#1c281f; color:var(--paper);}
  .slot .fund-name{font-size:12.5px; color:rgba(237,238,231,0.55); margin-top:4px; font-family:'Inter',sans-serif;}

  .overlap-results{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:20px;}
  .overlap-matrix{display:flex; flex-direction:column; gap:10px;}
  .pair-row{
    display:flex; align-items:center; gap:16px; padding:14px 16px;
    background:rgba(237,238,231,0.04); border:1px solid rgba(237,238,231,0.1);
  }
  .pair-names{font-family:'IBM Plex Mono',monospace; font-size:13.5px; width:150px; flex-shrink:0;}
  .pair-track{flex:1; height:10px; background:rgba(237,238,231,0.1); position:relative;}
  .pair-fill{height:100%; position:absolute; left:0; top:0;}
  .pair-pct{font-family:'IBM Plex Mono',monospace; font-size:14px; width:52px; text-align:right; font-weight:500;}

  .shared-title{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(237,238,231,0.5); margin-bottom:14px;}
  .chip-cloud{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:6px 12px;
    border:1px solid rgba(237,238,231,0.2); border-radius:20px; color:rgba(237,238,231,0.85);
  }
  .chip.hot{border-color:var(--gold); color:var(--gold); background:rgba(200,155,60,0.08);}
  .empty-note{color:rgba(237,238,231,0.45); font-size:13.5px; font-style:italic;}

  .disclaimer-strip{
    margin-top:40px; padding-top:24px; border-top:1px solid rgba(237,238,231,0.14);
    font-size:12.5px; color:rgba(237,238,231,0.5); line-height:1.6; max-width:70ch;
  }

  footer{
    padding:48px; text-align:center; font-size:13px; color:var(--ink-faint);
    border-top:1px solid var(--line);
  }

  @media (max-width:860px){
    .overlap-results{grid-template-columns:1fr;}
    nav{padding:16px 20px;}
    .workbench-shell{padding-left:22px; padding-right:22px;}
  }
</style>
</head>

let FUNDS = {};
let LIVE = false;

fetch('data/funds.json')
  .then(r => { if(!r.ok) throw new Error('fetch failed'); return r.json(); })
  .then(data => {
    const live = {};
    Object.entries(data).forEach(([t,v]) => {
      if(t.charAt(0) === '_') return;
      if(v.holdings && Object.keys(v.holdings).length){  // carried-forward funds have real data too
        live[t] = { name: v.name, issuer: v.issuer, region: v.region, holdings: v.holdings };
      }
    });
    if(Object.keys(live).length){ FUNDS = live; LIVE = true; }
    else { FUNDS = FALLBACK_FUNDS; }
    initTool();
  })
  .catch(() => { FUNDS = FALLBACK_FUNDS; initTool(); });

const selA = document.getElementById('fundA');
const selB = document.getElementById('fundB');
const selC = document.getElementById('fundC');

function populate(sel, includeNone){
  sel.innerHTML = '';
  if(includeNone){
    const o = document.createElement('option');
    o.value=""; o.textContent="— none —";
    sel.appendChild(o);
  }
  const groups = {CAD:"CAD-listed", US:"US-listed"};
  Object.entries(groups).forEach(([region,label])=>{
    const og = document.createElement('optgroup');
    og.label = label;
    Object.entries(FUNDS).filter(([t,f])=>f.region===region).forEach(([t,f])=>{
      const o = document.createElement('option');
      o.value=t; o.textContent=t;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
}
function initTool(){
  populate(selA,false);
  populate(selB,false);
  populate(selC,true);
  const keys = Object.keys(FUNDS);
  selA.value = FUNDS['HMAX'] ? 'HMAX' : keys[0];
  selB.value = FUNDS['BANK'] ? 'BANK' : keys[1];
  [selA,selB,selC].forEach(s=>s.addEventListener('change', render));
  updateDataStatus();
  render();
}

function updateDataStatus(){
  const el = document.getElementById('dataStatus');
  if(!el) return;
  const n = Object.keys(FUNDS).length;
  el.textContent = LIVE
    ? 'Live holdings for ' + n + ' funds, refreshed daily from issuer disclosures.'
    : 'Showing a cached snapshot of ' + n + ' funds — live holdings file unavailable right now.';
}

function overlapPct(a,b){
  const A=FUNDS[a].holdings, B=FUNDS[b].holdings;
  let shared=0;
  Object.keys(A).forEach(t=>{ if(B[t]!==undefined) shared += Math.min(A[t],B[t]); });
  return Math.min(Math.round(shared*10)/10, 100);
}
function sharedTickers(a,b){
  const A=FUNDS[a].holdings, B=FUNDS[b].holdings;
  return Object.keys(A).filter(t=>B[t]!==undefined);
}
function colorFor(pct){
  if(pct>=30) return 'var(--rust)';
  if(pct>=12) return 'var(--gold)';
  return 'var(--teal)';
}
function render(){
  const a=selA.value, b=selB.value, c=selC.value;
  if(!FUNDS[a] || !FUNDS[b]) return;
  document.getElementById('nameA').textContent = FUNDS[a].name;
  document.getElementById('nameB').textContent = FUNDS[b].name;
  document.getElementById('nameC').textContent = c ? FUNDS[c].name : '';

  const pairs = [[a,b]];
  if(c){ pairs.push([a,c]); pairs.push([b,c]); }

  const matrix = document.getElementById('overlapMatrix');
  matrix.innerHTML = '';
  const allShared = new Set();

  pairs.forEach(([x,y])=>{
    const pct = overlapPct(x,y);
    const row = document.createElement('div');
    row.className='pair-row';
    row.innerHTML = `
      <div class="pair-names">${x} × ${y}</div>
      <div class="pair-track"><div class="pair-fill" style="width:${Math.min(pct,100)}%; background:${colorFor(pct)};"></div></div>
      <div class="pair-pct">${pct}%</div>
    `;
    matrix.appendChild(row);
    sharedTickers(x,y).forEach(t=>allShared.add(t));
  });

  const cloud = document.getElementById('chipCloud');
  cloud.innerHTML='';
  if(allShared.size===0){
    cloud.innerHTML = '<div class="empty-note">No overlap in published holdings — these funds look genuinely diversified from each other.</div>';
  } else {
    const topPct = Math.max(...pairs.map(([x,y])=>overlapPct(x,y)));
    const weightOf = t => Math.max(...pairs.map(([x,y])=>{
      const A=FUNDS[x].holdings, B=FUNDS[y].holdings;
      return (A[t]!==undefined && B[t]!==undefined) ? Math.min(A[t],B[t]) : 0;
    }));
    const ranked = [...allShared].sort((m,n)=>weightOf(n)-weightOf(m));
    const CAP = 12;
    ranked.slice(0,CAP).forEach(t=>{
      const chip=document.createElement('div');
      chip.className='chip' + (topPct>=30 ? ' hot' : '');
      chip.textContent=t;
      cloud.appendChild(chip);
    });
    if(ranked.length > CAP){
      const more=document.createElement('div');
      more.className='chip';
      more.textContent='+' + (ranked.length - CAP) + ' more';
      cloud.appendChild(more);
    }
  }
}

const stops = document.querySelectorAll('.stop');
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); } });
}, {threshold:0.2});
stops.forEach(s=>io.observe(s));

function buildPath(){
  const wrap = document.querySelector('.path-wrap');
  const svg = document.getElementById('pathSvg');
  if(window.innerWidth <= 760) return;
  const wrapRect = wrap.getBoundingClientRect();
  const totalHeight = wrap.scrollHeight;
  svg.setAttribute('viewBox', `0 0 1000 ${totalHeight}`);
  svg.style.height = totalHeight + 'px';

  let d = '';
  stops.forEach((stop, i)=>{
    const r = stop.getBoundingClientRect();
    const top = r.top - wrapRect.top;
    const cx = stop.classList.contains('left') ? 560 : 440;
    const cy = top + 14;
    d += (i===0 ? `M 500 0 Q ${cx} ${Math.max(cy-60,20)} ${cx} ${cy} ` : `T ${cx} ${cy} `);
  });
  document.getElementById('pathBg').setAttribute('d', d);
  document.getElementById('pathFg').setAttribute('d', d);
  const pathLen = document.getElementById('pathFg').getTotalLength();
  document.getElementById('pathFg').style.strokeDasharray = pathLen;
  document.getElementById('pathFg').style.strokeDashoffset = pathLen;
  window._pathLen = pathLen;
}
function updateProgress(){
  const fg = document.getElementById('pathFg');
  if(!fg || !window._pathLen) return;
  const wrap = document.querySelector('.path-wrap');
  const rect = wrap.getBoundingClientRect();
  const viewportMid = window.innerHeight * 0.6;
  const progress = Math.min(1, Math.max(0, (viewportMid - rect.top) / rect.height));
  fg.style.strokeDashoffset = window._pathLen * (1 - progress);
}
window.addEventListener('load', ()=>{ buildPath(); updateProgress(); });
window.addEventListener('resize', buildPath);
window.addEventListener('scroll', updateProgress);

// --- hero beats -------------------------------------------------------
// One wheel notch (~100px) moves one beat. Boundaries are fixed pixel
// distances into the track rather than fractions of it, so pacing does not
// change with viewport height.
(function(){
  var track = document.getElementById("heroTrack");
  if (!track) return;
  var beats = [document.getElementById("beat1"), document.getElementById("beat2"), document.getElementById("beat3")];
  var dots = Array.prototype.slice.call(document.querySelectorAll("#beatDots i"));
  var cue = document.getElementById("heroCue");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    beats.forEach(function(b){ if(b) b.classList.add("on"); });
    return;
  }
  var current = -1;
  function paint(){
    var into = -track.getBoundingClientRect().top;
    var i = into < 55 ? 0 : (into < 115 ? 1 : 2);
    if (i === current) return;
    current = i;
    beats.forEach(function(b, n){
      if (!b) return;
      b.classList.toggle("on", n === i);
      b.classList.toggle("gone", n < i);
    });
    dots.forEach(function(d, n){ d.classList.toggle("on", n === i); });
    if (cue) cue.style.opacity = (i === 2) ? "0" : "0.9";
  }
  window.addEventListener("scroll", paint, {passive:true});
  document.addEventListener("scroll", paint, {passive:true, capture:true});
  window.addEventListener("resize", paint);
  paint();
})();

</script>
