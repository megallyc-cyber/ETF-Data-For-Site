name: API probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe free API tiers
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python probe_api.py
      - name: Commit probe report
        run: |
          git config user.name "ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/api-probe.json
          git diff --quiet --cached || git commit -m "API probe results"
          git push
