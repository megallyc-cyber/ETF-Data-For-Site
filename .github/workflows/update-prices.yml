name: Update price history

# Runs after the holdings scrape. First run backfills ~10y per fund and takes
# a while; later runs only top up recent bars, so they finish in a few minutes.
on:
  # schedule:
  #   - cron: '0 12 * * 1-5'
  #
  # Paused, not broken. Yahoo now refuses every request from GitHub's IP
  # ranges: the last scheduled run logged 126 refusals, reached 17 of 288
  # tickers in forty minutes and wrote nothing. Stooq serves a bot page and
  # Twelve Data has no TSX on the current plan, so there is no free source
  # left that answers.
  #
  # Restore the two lines above as soon as a paid feed is in place. Until
  # then this runs on demand only, so a daily failure notice does not train
  # anyone to ignore the alerts that matter.
  workflow_dispatch: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python prices.py
      - name: Commit prices
        run: |
          git config user.name "ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices
          git diff --quiet --cached || git commit -m "Update price history"
          # The scrape job commits to this branch too. If it landed while we
          # were fetching, a plain push is rejected and 20 minutes of price
          # history is thrown away. Rebase onto whatever arrived and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed price history on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo "Could not push price history after 5 attempts"
          exit 1
