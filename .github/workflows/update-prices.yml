name: Update price history

# Runs after the holdings scrape. First run backfills ~10y per fund and takes
# a while; later runs only top up recent bars, so they finish in a few minutes.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python prices.py
      - name: Commit prices
        run: |
          git config user.name "ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices
          git diff --quiet --cached || git commit -m "Update price history"
          git push
