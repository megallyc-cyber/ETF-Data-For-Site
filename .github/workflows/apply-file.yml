name: Apply file

# Writes one file from a gzip+base64 payload and commits it. Exists because
# pasting large files into the web editor is unreliable; a plain text input is not.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Repo path to write'
        required: true
      payload:
        description: 'base64 of gzipped file contents'
        required: true
      message:
        description: 'Commit message'
        required: false
        default: 'Apply file update'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write file
        env:
          TARGET: ${{ github.event.inputs.path }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          target = os.environ["TARGET"]
          data = gzip.decompress(base64.b64decode(os.environ["PAYLOAD"]))
          p = pathlib.Path(target)
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_bytes(data)
          print("wrote", len(data), "bytes to", target)
          PY
      - name: Stamp the shared assets with a version
        run: |
          python - <<'PY'
          import hashlib, pathlib, re

          # A browser holds assets/pro.js for as long as it likes once it has a
          # copy, and nothing in the page tells it a newer one exists. Phones
          # are the worst for this, and no reader is going to clear a cache.
          # Give the file a version in its URL that changes when the file does,
          # so a stale copy simply cannot be served.
          stamps = {}
          for asset in ("assets/pro.js", "assets/pro.css"):
              p = pathlib.Path(asset)
              if p.exists():
                  stamps[asset] = hashlib.sha1(p.read_bytes()).hexdigest()[:8]

          changed = []
          for page in pathlib.Path(".").glob("*.html"):
              text = page.read_text()
              before = text
              for asset, digest in stamps.items():
                  # rewrite src="assets/pro.js" or src="assets/pro.js?v=old"
                  text = re.sub(
                      re.escape(asset) + r'(\?v=[0-9a-f]+)?',
                      asset + "?v=" + digest,
                      text,
                  )
              if text != before:
                  page.write_text(text)
                  changed.append(page.name)

          print("stamped", stamps)
          print("updated", len(changed), "pages")
          PY
      - name: Commit
        env:
          MSG: ${{ github.event.inputs.message }}
        run: |
          git config user.name "ledger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "$MSG"
          git push
