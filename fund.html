<style>
  :root{
    --paper:#EDEEE7;
    --paper-raised:#F5F5F0;
    --ink:#152019;
    --ink-soft:#3F4A42;
    --ink-faint:#6E766E;
    --gold:#C89B3C;
    --gold-deep:#8F6B22;
    --teal:#1F5C4E;
    --teal-deep:#123D33;
    --rust:#A6452C;
    --line:rgba(21,32,25,0.14);
    --line-strong:rgba(21,32,25,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;
  }
  a{color:inherit;}
  .serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 48px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(237,238,231,0.92); backdrop-filter:blur(8px); z-index:20;
  }
  .brand{font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:-0.01em;}
  .brand .dot{color:var(--gold-deep);}
  .navlinks{display:flex; gap:32px; font-size:14px; color:var(--ink-soft);}
  .navlinks a{cursor:pointer; transition:color .2s; text-decoration:none;}
  .navlinks a:hover, .navlinks a.active{color:var(--ink);}
  .navlinks a.active{color:var(--gold-deep); font-weight:500;}

  .wrap{max-width:1100px; margin:0 auto; padding:28px 48px 90px;}

  .crumb{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint);
    text-decoration:none; display:inline-flex; align-items:center; gap:8px; margin-bottom:24px;
  }
  .crumb:hover{color:var(--ink);}

  .fund-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:32px; flex-wrap:wrap;
    padding-bottom:26px; border-bottom:1px solid var(--line);
  }
  .head-ticker{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(38px,6vw,58px);
    letter-spacing:-0.02em; line-height:1;
  }
  .head-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .region-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 9px; border-radius:3px;
    letter-spacing:0.04em;
  }
  .pill-cad{background:rgba(166,69,44,0.12); color:var(--rust);}
  .pill-us{background:rgba(31,92,78,0.12); color:var(--teal-deep);}
  .head-name{font-size:17px; color:var(--ink-soft); margin-top:10px; max-width:620px;}
  .head-issuer{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-faint); margin-top:8px;
  }
  .head-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    font-size:13px; padding:9px 16px; border:1px solid var(--line-strong); border-radius:4px;
    background:transparent; color:var(--ink); cursor:pointer; text-decoration:none;
    transition:background .2s, color .2s;
  }
  .btn:hover{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .stat-strip{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); margin:30px 0 40px;
  }
  .stat{background:var(--paper-raised); padding:18px 20px;}
  .stat-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint);
  }
  .stat-value{
    font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin-top:6px; line-height:1.1;
  }
  .stat-sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:6px;}

  .section{margin-bottom:48px;}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  h2{font-family:'Fraunces',serif; font-weight:500; font-size:23px; letter-spacing:-0.01em;}
  .section-note{font-size:12.5px; color:var(--ink-faint); max-width:560px;}

  .sector-bar{
    display:flex; height:32px; width:100%; border-radius:3px; overflow:hidden; margin-bottom:18px;
    border:1px solid var(--line);
  }
  .sector-seg{height:100%;}
  .sector-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px 26px;}
  .sector-row{
    display:flex; align-items:center; gap:10px; font-size:13.5px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .swatch{width:11px; height:11px; border-radius:2px; flex:none;}
  .sector-name{flex:1; color:var(--ink-soft);}
  .sector-pct{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}

  .lookthrough{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px;}
  .lt-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:14px 16px;
    text-decoration:none; display:block; transition:border-color .2s, transform .2s;
  }
  .lt-card:hover{border-color:var(--line-strong); transform:translateY(-2px);}
  .lt-card.dead{cursor:default;}
  .lt-card.dead:hover{transform:none; border-color:var(--line);}
  .lt-ticker{font-family:'Fraunces',serif; font-weight:600; font-size:17px;}
  .lt-weight{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold-deep); float:right;}
  .lt-name{font-size:12.5px; color:var(--ink-faint); margin-top:4px; line-height:1.4;}

  .tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  .search{
    flex:1; min-width:200px; padding:9px 12px; font-family:'Inter',sans-serif; font-size:13px;
    border:1px solid var(--line-strong); border-radius:4px; background:var(--paper-raised); color:var(--ink);
  }
  .search:focus{outline:none; border-color:var(--ink);}
  .sort-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:8px 12px; border-radius:4px;
    border:1px solid var(--line-strong); background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .sort-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--ink-faint); font-weight:500; padding:0 12px 10px 0; border-bottom:1px solid var(--line-strong);
  }
  th.num, td.num{text-align:right; padding-right:0;}
  td{padding:11px 12px 11px 0; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
  .rank{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint); width:44px;}
  .tick{font-family:'IBM Plex Mono',monospace; font-weight:500;}
  .tick a{color:var(--gold-deep); text-decoration:none;}
  .tick a:hover{text-decoration:underline;}
  .sect{font-size:12.5px; color:var(--ink-faint);}
  .wt{font-family:'IBM Plex Mono',monospace; font-size:13px; width:70px;}
  .bar-cell{width:34%; min-width:120px;}
  .bar-track{height:7px; background:rgba(21,32,25,0.07); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--teal); border-radius:4px;}

  /* --- distributions ------------------------------------------------ */
  .cadence{
    display:flex; align-items:flex-end; gap:3px; height:96px; margin:6px 0 4px;
    padding:10px 12px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:4px; overflow:hidden;
  }
  .cbar{
    flex:1 1 0; min-width:3px; background:var(--teal); border-radius:2px 2px 0 0;
    position:relative; transition:background .15s;
  }
  .cbar.latest{background:var(--gold-deep);}
  .cbar.cut{background:var(--rust);}
  .cbar:hover{background:var(--ink);}
  .cbar-label{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);
    margin-bottom:14px;
  }
  .dist-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .dist-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--ink-faint); font-weight:500; padding:0 12px 8px 0;
    border-bottom:1px solid var(--line-strong);
  }
  .dist-table td{
    padding:9px 12px 9px 0; border-bottom:1px solid var(--line);
    font-size:13.5px; font-family:'IBM Plex Mono',monospace;
  }
  .dist-table td.amt{text-align:right; padding-right:0;}
  .dist-more{
    margin-top:12px; font-size:12.5px; color:var(--ink-faint); background:none;
    border:none; border-bottom:1px solid var(--line-strong); cursor:pointer;
    padding:0 0 2px; font-family:inherit;
  }
  .dist-more:hover{color:var(--ink);}


  .empty{
    padding:44px 20px; text-align:center; color:var(--ink-faint); font-size:14px;
    border:1px dashed var(--line-strong); border-radius:4px;
  }
  .data-note{
    margin-top:44px; font-size:12.5px; color:var(--ink-faint);
    border-top:1px solid var(--line); padding-top:20px; line-height:1.7;
  }
  .loading{padding:70px 0; text-align:center; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:13px;}

  @media (max-width:640px){
    nav{padding:16px 20px;}
    .navlinks{gap:18px; font-size:13px;}
    .wrap{padding:22px 20px 70px;}
    .bar-cell{display:none;}
    .sect{display:none;}
  }
</style>

const FUND_URL = t => 'fund.html?t=' + encodeURIComponent(t);

let FUNDS = {}, TICKER = '', SORT = 'weight', FILTER = '';

function qs(name){
  const m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}

function fmt(n, d){ return Number(n).toFixed(d === undefined ? 2 : d); }

function sectorOf(t){ return SECTOR_MAP[t] || 'Other'; }

fetch('data/funds.json')
  .then(r => { if(!r.ok) throw new Error('fetch failed'); return r.json(); })
  .then(data => {
    Object.entries(data).forEach(([t, v]) => {
      if(t.charAt(0) === '_') return;
      if(v.holdings && Object.keys(v.holdings).length){  // carried-forward funds have real data too
        FUNDS[t] = { name: v.name, issuer: v.issuer, region: v.region, holdings: v.holdings, stats: v.stats || {}, as_of: v.as_of || '', stale: !!v.stale, distributions: v.distributions || [] };
      }
    });
    render();
  })
  .catch(() => {
    document.getElementById('stage').innerHTML =
      '<div class="empty">Couldn\'t load the holdings file. Try again in a moment.</div>';
  });

function render(){
  TICKER = (qs('t') || '').toUpperCase();
  const f = FUNDS[TICKER];
  const stage = document.getElementById('stage');

  if(!f){
    stage.innerHTML =
      '<div class="empty">No live holdings for <strong>' + (TICKER || 'that ticker') + '</strong>. ' +
      'It may be one of the funds whose issuer only publishes holdings as a PDF. ' +
      '<a href="funds.html">Browse the funds we do cover →</a></div>';
    document.title = 'Fund not found — Licentia';
    return;
  }

  document.title = TICKER + ' — ' + f.name + ' — Licentia';

  const rows = Object.entries(f.holdings).sort((a,b) => b[1]-a[1]);
  const total = rows.reduce((s,[,w]) => s+w, 0);
  const topN = rows.length > 10 ? 10 : Math.min(3, rows.length);
  const topSum = rows.slice(0,topN).reduce((s,[,w]) => s+w, 0);
  const top10pct = total ? (topSum/total*100) : 0;
  // effective number of holdings (inverse Herfindahl) — how concentrated it really is
  const hhi = rows.reduce((s,[,w]) => { const p = total ? w/total : 0; return s + p*p; }, 0);
  const effective = hhi ? 1/hhi : 0;

  const fundHoldings = rows.filter(([t]) => FUNDS[t] || sectorOf(t) === 'Fund / ETF');
  const fundWeight = fundHoldings.reduce((s,[,w]) => s+w, 0);
  const isWrapper = total > 0 && (fundWeight/total) > 0.6;
  const structure = isWrapper
    ? (rows.length <= 2 ? 'Wrapper' : 'Fund of funds')
    : (rows.length === 1 ? 'Single name' : 'Direct equity');

  const pill = f.region === 'CAD' ? 'pill-cad' : 'pill-us';

  stage.innerHTML = `
    <div class="fund-head">
      <div>
        <div class="head-row">
          <div class="head-ticker">${TICKER}</div>
          <span class="region-pill ${pill}">${f.region === 'CAD' ? 'CAD-listed' : 'US-listed'}</span>
        </div>
        <div class="head-name">${f.name}</div>
        <div class="head-issuer">${f.issuer || 'Issuer not recorded'}</div>
        <div class="head-issuer" style="margin-top:4px;">${asOfLine(f)}</div>
      </div>
      <div class="head-actions">
        <a class="btn" href="compare.html">Compare against another fund</a>
      </div>
    </div>

    <div class="section" style="margin-top:30px; margin-bottom:34px;">
      <div class="section-head">
        <h2>Key facts</h2>
        <div class="section-note">Read from ${f.issuer || 'the issuer'}'s own fund page on the same run that pulls holdings.</div>
      </div>
      ${keyFacts(f.stats || {}, f.issuer)}
    </div>

    ${distributionSection(f)}

    <div class="section-head"><h2>Portfolio shape</h2></div>
    <div class="stat-strip">
      <div class="stat">
        <div class="stat-label">Holdings</div>
        <div class="stat-value">${rows.length}</div>
        <div class="stat-sub">positions disclosed</div>
      </div>
      <div class="stat">
        <div class="stat-label">Top ${topN} weight</div>
        <div class="stat-value">${fmt(top10pct,1)}%</div>
        <div class="stat-sub">of the portfolio</div>
      </div>
      <div class="stat">
        <div class="stat-label">Largest position</div>
        <div class="stat-value">${rows[0][0]}</div>
        <div class="stat-sub">${fmt(rows[0][1],2)}% weight</div>
      </div>
      <div class="stat">
        <div class="stat-label">Effective holdings</div>
        <div class="stat-value">${fmt(effective,1)}</div>
        <div class="stat-sub">concentration-adjusted</div>
      </div>
      <div class="stat">
        <div class="stat-label">Structure</div>
        <div class="stat-value" style="font-size:20px;">${structure}</div>
        <div class="stat-sub">${isWrapper ? fmt(fundWeight/total*100,0) + '% held via other funds' : 'holds securities directly'}</div>
      </div>
    </div>

    ${isWrapper ? lookthroughSection(fundHoldings, total) : ''}
    ${sectorSection(rows, total, isWrapper)}

    <div class="section">
      <div class="section-head">
        <h2>All holdings</h2>
        <div class="section-note">Weights as published by ${f.issuer || 'the issuer'}. They may not sum to 100% — cash, collateral and written options sit outside the equity sleeve.</div>
      </div>
      <div class="tools">
        <input class="search" id="search" type="text" placeholder="Filter by ticker…">
        <button class="sort-btn active" data-sort="weight">By weight</button>
        <button class="sort-btn" data-sort="ticker">A–Z</button>
      </div>
      <div id="tableWrap"></div>
    </div>

    <div class="data-note">
      Holdings are pulled straight from ${f.issuer || 'the issuer'}'s published holdings file and refreshed daily.
      Sector labels are our own mapping, not the issuer's — treat them as a rough shape, not a classification.
      Yield and expense labels are reproduced exactly as the issuer words them — a 30-day SEC yield and a
      trailing 12-month distribution yield are not the same number and are not comparable across issuers.
      Not investment advice.
    </div>
  `;

  const more = document.getElementById('distMore');
  if(more){
    more.addEventListener('click', () => {
      const body = document.getElementById('distRows');
      body.innerHTML = (f.distributions || []).map(x =>
        '<tr><td>' + x.ex_date + '</td><td>' + (x.pay_date || '—') +
        '</td><td class="amt">$' + x.amount.toFixed(4) + '</td></tr>').join('');
      more.remove();
    });
  }

  document.getElementById('search').addEventListener('input', e => {
    FILTER = e.target.value.trim().toUpperCase();
    renderTable(rows, total);
  });
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.sort-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      SORT = b.dataset.sort;
      renderTable(rows, total);
    });
  });
  renderTable(rows, total);
}

function asOfLine(f){
  if(!f.as_of) return 'Holdings date not recorded';
  if(!f.stale) return 'Holdings as of ' + f.as_of;
  // Say so plainly. A number with no date reads as today's number.
  return '<span style="color:var(--rust);">Holdings as of ' + f.as_of +
         ' — the issuer page was unreachable on the last run, so this is the last good copy.</span>';
}

function fmtAum(m){
  if(m === undefined || m === null) return null;
  if(m >= 1000) return '$' + (m/1000).toFixed(m >= 100000 ? 0 : 1) + 'B';
  if(m >= 1) return '$' + m.toFixed(m >= 100 ? 0 : 1) + 'M';
  return '$' + (m*1000).toFixed(0) + 'K';
}

function titleCase(s){
  return s.replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/Sec /,'SEC ').replace(/Mer/,'MER');
}

function distProvenance(f, count){
  const src = (f.stats || {}).distribution_source || 'issuer';
  if(src === 'issuer') return count + ' payments published by ' + f.issuer + '.';
  // aggregated elsewhere because the issuer publishes no parseable table
  return count + ' payments via <a href="https://dividendhistory.org" target="_blank" rel="noopener" ' +
         'style="color:var(--gold-deep);">dividendhistory.org</a>, because ' + f.issuer +
         " doesn't publish a machine-readable history.";
}

function distributionSection(f){
  const d = f.distributions || [];
  const st = f.stats || {};
  if(!d.length){
    // A fund that pays but whose issuer doesn't publish a table still has a
    // last payment in stats — show that rather than an empty section.
    if(st.last_amount){
      return `
      <div class="section">
        <div class="section-head"><h2>Distributions</h2></div>
        <div class="stat-strip">
          <div class="stat">
            <div class="stat-label">Latest payment</div>
            <div class="stat-value">$${Number(st.last_amount).toFixed(4)}</div>
            <div class="stat-sub">${st.last_ex_date ? 'ex-date ' + st.last_ex_date : ''}</div>
          </div>
        </div>
        <div class="section-note" style="margin-top:12px;">${f.issuer} publishes the latest
        payment but not a full history, so there's nothing further to chart.</div>
      </div>`;
    }
    return `
      <div class="section">
        <div class="section-head"><h2>Distributions</h2></div>
        <div class="empty" style="padding:22px;">No distribution history yet for ${f.issuer}.
        Neither the issuer nor dividendhistory.org publishes a payment table we can read for this fund.</div>
      </div>`;
  }

  const recent = d.slice(0, 24).reverse();          // oldest → newest, left to right
  const max = Math.max(...recent.map(x => x.amount));
  const bars = recent.map((x, i) => {
    const h = Math.max(3, (x.amount / max) * 100);
    const prev = i > 0 ? recent[i-1].amount : x.amount;
    // a visible cut is the thing income investors are actually watching for
    const cut = x.amount < prev * 0.95;
    const isLast = i === recent.length - 1;
    const cls = isLast ? 'cbar latest' : (cut ? 'cbar cut' : 'cbar');
    return `<div class="${cls}" style="height:${h}%" title="${x.ex_date}: $${x.amount.toFixed(4)}"></div>`;
  }).join('');

  const rows = d.slice(0, 12).map(x => `
    <tr>
      <td>${x.ex_date}</td>
      <td>${x.pay_date || '—'}</td>
      <td class="amt">$${x.amount.toFixed(4)}</td>
    </tr>`).join('');

  const cuts = recent.filter((x,i) => i > 0 && x.amount < recent[i-1].amount * 0.95).length;
  const trend = cuts === 0
    ? 'Held or raised at every payment shown.'
    : cuts + (cuts === 1 ? ' cut' : ' cuts') + ' in the last ' + recent.length + ' payments.';

  return `
  <div class="section">
    <div class="section-head">
      <h2>Distributions</h2>
      <div class="section-note">${distProvenance(f, d.length)} ${trend}</div>
    </div>

    <div class="stat-strip">
      <div class="stat">
        <div class="stat-label">Latest payment</div>
        <div class="stat-value">$${d[0].amount.toFixed(4)}</div>
        <div class="stat-sub">ex-date ${d[0].ex_date}</div>
      </div>
      ${st.ttm_total ? `<div class="stat">
        <div class="stat-label">Paid last 12 months</div>
        <div class="stat-value">$${Number(st.ttm_total).toFixed(2)}</div>
        <div class="stat-sub">${st.ttm_payments || ''} payments</div>
      </div>` : ''}
      ${st.frequency ? `<div class="stat">
        <div class="stat-label">Frequency</div>
        <div class="stat-value" style="font-size:20px;">${st.frequency}</div>
        <div class="stat-sub">as stated by the issuer</div>
      </div>` : ''}
    </div>

    <div class="cbar-label" style="margin-top:26px;">
      <span>${recent[0].ex_date}</span><span>most recent ${recent.length} payments</span><span>${recent[recent.length-1].ex_date}</span>
    </div>
    <div class="cadence">${bars}</div>

    <table class="dist-table">
      <thead><tr><th>Ex-date</th><th>Paid</th><th class="amt" style="text-align:right;">Amount</th></tr></thead>
      <tbody id="distRows">${rows}</tbody>
    </table>
    ${d.length > 12 ? `<button class="dist-more" id="distMore">Show all ${d.length} payments</button>` : ''}
  </div>`;
}

function keyFacts(st, issuer){
  const cells = [];
  const aum = fmtAum(st.aum_musd);
  if(aum){
    cells.push(['Fund size', aum, st.aum_display || '']);
  }
  if(st.yield){
    cells.push([titleCase(st.yield_label || 'Yield'), st.yield, "the issuer's own measure"]);
  }
  if(st.mer){
    cells.push([titleCase(st.mer_label || 'MER'), st.mer, '']);
  } else if(st.mgmt_fee){
    cells.push(['Management fee', st.mgmt_fee, '']);
  }
  if(st.nav){
    cells.push(['NAV', st.nav, 'per unit']);
  }
  if(!cells.length){
    return '<div class="empty" style="padding:22px;">' + (issuer || 'This issuer') +
      " doesn't publish fund size, yield or MER on the page we read holdings from, " +
      'so we have nothing to show here rather than a guess.</div>';
  }
  return '<div class="stat-strip">' + cells.map(([l,v,sub]) =>
    '<div class="stat"><div class="stat-label">' + l + '</div>' +
    '<div class="stat-value">' + v + '</div>' +
    '<div class="stat-sub">' + sub + '</div></div>'
  ).join('') + '</div>';
}

function lookthroughSection(fundHoldings, total){
  const cards = fundHoldings.map(([t,w]) => {
    const known = FUNDS[t];
    const pct = total ? (w/total*100) : 0;
    if(known){
      return `<a class="lt-card" href="${FUND_URL(t)}">
        <span class="lt-weight">${fmt(pct,1)}%</span>
        <div class="lt-ticker">${t}</div>
        <div class="lt-name">${known.name}</div>
      </a>`;
    }
    return `<div class="lt-card dead">
      <span class="lt-weight">${fmt(pct,1)}%</span>
      <div class="lt-ticker">${t}</div>
      <div class="lt-name">Not tracked separately</div>
    </div>`;
  }).join('');
  return `
    <div class="section">
      <div class="section-head">
        <h2>What's underneath</h2>
        <div class="section-note">This fund mostly holds other funds. The real exposure sits one level down — open any tracked holding to keep drilling.</div>
      </div>
      <div class="lookthrough">${cards}</div>
    </div>
  `;
}

function sectorSection(rows, total, isWrapper){
  const by = {};
  let classified = 0;
  rows.forEach(([t,w]) => {
    const s = sectorOf(t);
    by[s] = (by[s] || 0) + w;
    if(s !== 'Other') classified += w;
  });
  const coverage = total ? classified/total : 0;
  const ordered = Object.entries(by).sort((a,b) => b[1]-a[1]);

  if(isWrapper || coverage < 0.5){
    return `
      <div class="section">
        <div class="section-head"><h2>Sector mix</h2></div>
        <div class="empty">${isWrapper
          ? 'This fund holds other funds, so a sector split of its own holdings would just say "funds". Drill into the underlying funds above for the real sector exposure.'
          : 'We can only classify ' + fmt(coverage*100,0) + '% of this portfolio by sector, which is not enough to show an honest breakdown.'}</div>
      </div>
    `;
  }

  const bar = ordered.map(([s,w]) =>
    `<div class="sector-seg" style="width:${(w/total*100)}%; background:${SECTOR_COLORS[s] || SECTOR_COLORS.Other};" title="${s}"></div>`
  ).join('');

  const list = ordered.map(([s,w]) => `
    <div class="sector-row">
      <span class="swatch" style="background:${SECTOR_COLORS[s] || SECTOR_COLORS.Other};"></span>
      <span class="sector-name">${s}</span>
      <span class="sector-pct">${fmt(w/total*100,1)}%</span>
    </div>
  `).join('');

  return `
    <div class="section">
      <div class="section-head">
        <h2>Sector mix</h2>
        <div class="section-note">Our own ticker-to-sector mapping applied to published weights, normalised to the equity sleeve.</div>
      </div>
      <div class="sector-bar">${bar}</div>
      <div class="sector-list">${list}</div>
    </div>
  `;
}

function renderTable(rows, total){
  let list = rows.slice();
  if(FILTER) list = list.filter(([t]) => t.toUpperCase().indexOf(FILTER) !== -1);
  if(SORT === 'ticker') list.sort((a,b) => a[0].localeCompare(b[0]));
  else list.sort((a,b) => b[1]-a[1]);

  const wrap = document.getElementById('tableWrap');
  if(!list.length){
    wrap.innerHTML = '<div class="empty">Nothing matches that filter.</div>';
    return;
  }
  const max = Math.max(...rows.map(([,w]) => w));
  const body = list.map(([t,w], i) => {
    const known = FUNDS[t];
    const rank = SORT === 'weight' ? (i+1) : (rows.findIndex(r => r[0] === t) + 1);
    return `<tr>
      <td class="rank">${rank}</td>
      <td class="tick">${known ? '<a href="' + FUND_URL(t) + '">' + t + '</a>' : t}</td>
      <td class="sect">${sectorOf(t)}</td>
      <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${(w/max*100)}%;"></div></div></td>
      <td class="wt num">${fmt(w,2)}%</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>Ticker</th><th>Sector</th><th></th><th class="num">Weight</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}
</script>
</body>
</html>
