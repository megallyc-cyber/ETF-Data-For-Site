<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Builder — Licentia</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE9; --paper-raised:#FBF9F5; --white:#FFFFFF;
    --ink:#1C2230; --ink-soft:#4A5262; --ink-faint:#8A9099;
    --ember:#FF6B35; --ember-deep:#D4501F;
    --gold:#FF6B35; --gold-deep:#D4501F;
    --teal:#2F3E57; --teal-deep:#1C2230;
    --rust:#E5484D; --up:#4CB782; --down:#E5484D;
    --line:rgba(28,34,48,0.13); --line-strong:rgba(28,34,48,0.26);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink);
    font-family:'Inter',ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;}
  nav{display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:11px 26px; background:var(--ink); position:sticky; top:0; z-index:40; flex-wrap:wrap;}
  nav .brand{font-family:'Space Grotesk',ui-sans-serif,sans-serif; font-weight:700;
    font-size:19px; letter-spacing:-0.02em; color:var(--paper); text-decoration:none;
    display:inline-flex; align-items:center;}
  .brand-bird{display:inline-block; width:25px; height:16px; margin-left:8px; vertical-align:-1px;}
  .navlinks{display:flex; gap:7px; flex-wrap:wrap;}
  .navlinks a{font-size:13.5px; padding:8px 15px; border-radius:100px; text-decoration:none;
    border:1px solid rgba(242,239,233,0.24); color:rgba(242,239,233,0.74);
    white-space:nowrap; transition:all .16s;}
  .navlinks a:hover{border-color:var(--paper); color:var(--paper);}
  .navlinks a.active{background:var(--ember); border-color:var(--ember); color:var(--ink); font-weight:500;}
  @media(max-width:820px){ nav{padding:10px 16px;} .navlinks a{padding:7px 11px; font-size:12.5px;} }

  .wrap{max-width:1180px; margin:0 auto; padding:36px 26px 90px;}
  .head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,3.4vw,40px);
    letter-spacing:-0.02em; line-height:1.1; margin-bottom:8px;}
  .sub{font-size:15px; color:var(--ink-soft); line-height:1.6; max-width:60ch;}
  /* Status pill: large enough to read at a glance, with a slow sheen so the
     reader notices which tier they are on without it blinking at them. */
  .tier{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:10px;
    padding:14px 26px; border-radius:100px; color:var(--paper);
    background:linear-gradient(115deg, var(--ink) 0%, #33405C 45%, var(--ink) 100%);
    background-size:220% 100%; animation:tierdrift 9s ease-in-out infinite;
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.12em;
    text-transform:uppercase; white-space:nowrap;
    box-shadow:0 6px 18px rgba(28,34,48,0.20);}
  .tier b{color:var(--ember); font-weight:500; letter-spacing:0.06em;}
  .tier::after{content:''; position:absolute; top:0; bottom:0; width:38%;
    background:linear-gradient(100deg, transparent, rgba(255,107,53,0.22), transparent);
    transform:translateX(-140%); animation:tiersheen 5.5s ease-in-out infinite;}
  .tier.pro{background:linear-gradient(115deg, #D4501F 0%, #FF6B35 50%, #D4501F 100%);
    background-size:220% 100%; color:var(--ink);}
  .tier.pro b{color:var(--ink);}
  @keyframes tierdrift{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  @keyframes tiersheen{ 0%{transform:translateX(-140%);} 55%,100%{transform:translateX(320%);} }
  @media (prefers-reduced-motion: reduce){
    .tier{animation:none;} .tier::after{animation:none; opacity:0;}
  }

  /* Two equal columns that stretch to the same height, so neither panel
     looks like an afterthought beside the other. */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:30px; align-items:stretch;}
  .panel{display:flex; flex-direction:column;}
  .panel-body{flex:1; display:flex; flex-direction:column;}
  .picklist{flex:1;}
  @media(max-width:960px){ .grid{grid-template-columns:1fr;} }
  .panel{background:var(--white); border:1px solid var(--line); border-radius:13px; padding:22px 24px;}
  .panel h2{font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin-bottom:4px;}
  .panel .note{font-size:13px; color:var(--ink-faint); line-height:1.55; margin-bottom:16px;}

  .search{width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--line-strong);
    font-family:inherit; font-size:14.5px; background:var(--paper-raised); margin-bottom:12px;}
  .search:focus{outline:none; border-color:var(--ember); box-shadow:0 0 0 3px rgba(255,107,53,0.14);}
  .picklist{min-height:360px; max-height:520px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .pick{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    border:1px solid rgba(var(--famrgb),0.22); cursor:pointer; text-align:left;
    background:linear-gradient(150deg, rgba(var(--famrgb),0.10) 0%, rgba(var(--famrgb),0.02) 60%, rgba(255,255,255,0.7) 100%);
    font-family:inherit; transition:transform .14s, box-shadow .14s;}
  .pick:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(28,34,48,0.09);}
  .pick:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none;}
  .pick .tic{font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:500; min-width:56px;}
  .pick .nm{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .pick .yl{font-family:'Fraunces',serif; font-size:17px; color:var(--fam);}
  .locked-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    border:1px dashed var(--line-strong); font-size:12.5px; color:var(--ink-faint);}

  .holding{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    border:1px solid rgba(var(--famrgb),0.26); margin-bottom:9px;
    background:linear-gradient(155deg, rgba(var(--famrgb),0.13) 0%, rgba(var(--famrgb),0.03) 55%, rgba(255,255,255,0.75) 100%);}
  .holding .tic{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:500; min-width:58px;}
  .holding .nm{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .wt{width:74px; padding:7px 9px; border-radius:7px; border:1px solid var(--line-strong);
    font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; background:var(--white);}
  .wt:focus{outline:none; border-color:var(--ember);}
  .rm{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:17px; padding:0 4px;}
  .rm:hover{color:var(--rust);}
  .empty{padding:26px 18px; text-align:center; color:var(--ink-faint); font-size:13.5px;
    border:1px dashed var(--line-strong); border-radius:10px; line-height:1.6;}

  .totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:11px; overflow:hidden; margin:18px 0;}
  .tot{background:var(--white); padding:15px 16px;}
  .tot .v{font-family:'Fraunces',serif; font-size:25px; line-height:1;}
  .tot .v:not(:has(*)){overflow-wrap:anywhere;}
  .tot .v.small{font-size:14px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}
  .tot .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.11em;
    text-transform:uppercase; color:var(--ink-faint); margin-top:7px;}
  .tot .v.up{color:var(--up);} .tot .v.down{color:var(--down);}

  .weightbar{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--line); margin-bottom:6px;}
  .weightbar div{transition:width .25s;}
  .wnote{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);}
  .wnote.bad{color:var(--rust);}

  .secbar{display:flex; height:30px; border-radius:6px; overflow:hidden; background:var(--line); margin:8px 0 12px;}
  /* legend sized to be read, not squinted at */
  .seclegend{display:flex; flex-wrap:wrap; gap:12px 22px;}
  .sk{display:inline-flex; align-items:center; gap:9px;
    font-family:'Inter',ui-sans-serif,sans-serif; font-size:13.5px; color:var(--ink);}
  .sk i{width:15px; height:15px; border-radius:4px; display:block; flex:none;
    box-shadow:0 0 0 1px rgba(28,34,48,0.10) inset;}

  .upsell{margin-top:22px; border-radius:13px; padding:28px 30px; color:var(--paper);
    background:linear-gradient(150deg, var(--ink) 0%, #2A3346 100%);
    display:grid; grid-template-columns:minmax(240px,0.9fr) 2fr; gap:28px; align-items:center;}
  @media(max-width:900px){ .upsell{grid-template-columns:1fr;} }
  .upsell-copy{min-width:0;}
  .upsell h3{font-family:'Fraunces',serif; font-weight:500; font-size:21px; margin-bottom:8px;}
  .upsell p{font-size:14px; line-height:1.65; color:rgba(242,239,233,0.76); max-width:56ch;}
  .plans{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:0;}
  @media(max-width:760px){ .plans{grid-template-columns:1fr;} }
  .plan{border:1px solid rgba(242,239,233,0.2); border-radius:11px; padding:16px 18px;}
  .plan.on{border-color:var(--ember); background:rgba(255,107,53,0.10);}
  .plan .pn{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ember); margin-bottom:9px;}
  .plan ul{list-style:none; display:flex; flex-direction:column; gap:7px;}
  .plan li{font-size:13px; color:rgba(242,239,233,0.82); line-height:1.45; display:flex; gap:8px;}
  .cta{display:inline-block; margin-top:16px; padding:12px 22px; border-radius:9px;
    background:var(--ember); color:var(--ink); font-weight:500; font-size:14.5px;
    text-decoration:none; border:none; cursor:pointer; font-family:inherit; transition:transform .16s;}
  .cta:hover{transform:translateY(-2px);}
  .ghost{display:inline-block; margin-top:16px; margin-left:10px; padding:12px 20px; border-radius:9px;
    border:1px solid rgba(242,239,233,0.3); color:var(--paper); text-decoration:none; font-size:14px;}
  .foot{margin-top:34px; font-size:12px; color:var(--ink-faint); line-height:1.7; max-width:70ch;}

  /* ---- guided flow ------------------------------------------------------
     One question at a time. The progress rail is always visible so the reader
     knows how much is left and can go back without losing an answer. */
  .rail{display:flex; align-items:center; gap:0; margin:26px 0 34px; flex-wrap:wrap;}
  .step-dot{display:flex; align-items:center; gap:10px; flex:none;}
  .step-dot i{width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-style:normal;
    border:1px solid var(--line-strong); color:var(--ink-faint); background:var(--white);
    transition:all .2s;}
  .step-dot span{font-size:12.5px; color:var(--ink-faint); white-space:nowrap;}
  .step-dot.on i{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .step-dot.on span{color:var(--ink); font-weight:500;}
  .step-dot.done i{background:var(--ember); border-color:var(--ember); color:var(--ink);}
  .step-dot.done span{color:var(--ink-soft);}
  .rail hr{flex:1; min-width:16px; height:1px; border:none; background:var(--line-strong); margin:0 12px;}
  @media(max-width:860px){ .step-dot span{display:none;} .rail hr{margin:0 6px;} }

  .qwrap{max-width:900px;}
  .qhead{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(24px,3vw,34px);
    letter-spacing:-0.02em; line-height:1.15; margin-bottom:10px;}
  .qsub{font-size:15px; color:var(--ink-soft); line-height:1.65; max-width:60ch; margin-bottom:26px;}

  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:13px;}
  .opt{position:relative; text-align:left; cursor:pointer; font-family:inherit;
    background:var(--white); border:1px solid var(--line-strong); border-radius:12px;
    padding:20px 22px; transition:transform .16s, box-shadow .16s, border-color .16s;}
  .opt:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(28,34,48,0.12); border-color:var(--ink);}
  .opt.sel{border-color:var(--ember); box-shadow:0 0 0 3px rgba(255,107,53,0.16);}
  .opt .ot{font-family:'Fraunces',serif; font-size:20px; margin-bottom:6px;}
  .opt .od{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .opt .oflag{display:inline-block; margin-top:11px; font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 9px; border-radius:100px;}
  .oflag.warn{background:rgba(229,72,77,0.12); color:#A32C31;}
  .oflag.note{background:rgba(255,107,53,0.13); color:var(--ember-deep);}
  .oflag.calm{background:rgba(76,183,130,0.14); color:#2C7A55;}

  .amount{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .amount .cur{font-family:'Fraunces',serif; font-size:30px; color:var(--ink-faint);}
  .amount input{max-width:260px; font-family:'Fraunces',serif; font-size:30px; padding:10px 14px;}
  .chips{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px;}
  .chip{padding:9px 16px; border-radius:100px; border:1px solid var(--line-strong);
    background:var(--white); font-family:inherit; font-size:13.5px; cursor:pointer; transition:all .15s;}
  .chip:hover{border-color:var(--ink);}
  .chip.sel{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .disclaim{margin-top:22px; border-left:3px solid var(--ember); background:rgba(255,107,53,0.07);
    padding:16px 20px; border-radius:0 10px 10px 0; font-size:13.5px; line-height:1.7; color:var(--ink-soft);}
  .disclaim b{color:var(--ink);}
  .disclaim.hot{border-left-color:var(--rust); background:rgba(229,72,77,0.08);}

  .navrow{display:flex; align-items:center; gap:12px; margin-top:30px; flex-wrap:wrap;}
  .helpme{margin-top:26px; padding:20px 22px; border-radius:12px; color:var(--paper);
    background:linear-gradient(150deg, var(--ink) 0%, #2A3346 100%);
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;}
  .helpme p{font-size:14px; line-height:1.6; color:rgba(242,239,233,0.78); max-width:52ch;}
  .helpme b{color:var(--paper); font-weight:500;}

  .working{text-align:center; padding:70px 20px;}
  .working .bar{max-width:420px; height:4px; margin:24px auto 0; border-radius:4px;
    background:var(--line); overflow:hidden;}
  .working .bar i{display:block; height:100%; width:0; background:var(--ember);
    transition:width .35s ease;}
  .working .msg2{margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    color:var(--ink-faint); letter-spacing:0.06em;}

  .recs{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; margin-top:8px;}
  .rec{background:var(--white); border:1px solid var(--line); border-radius:13px; padding:22px 24px;
    display:flex; flex-direction:column;}
  .rec.best{border-color:var(--ember); box-shadow:0 0 0 3px rgba(255,107,53,0.13);}
  .rec .rtag{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ember-deep); margin-bottom:8px;}
  .rec h3{font-family:'Fraunces',serif; font-weight:500; font-size:21px; margin-bottom:6px;}
  .rec .rdesc{font-size:13px; color:var(--ink-soft); line-height:1.55; margin-bottom:16px;}
  .rstats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px;}
  .rstat{background:var(--white); padding:12px 13px;}
  .rstat .v{font-family:'Fraunces',serif; font-size:20px; line-height:1;}
  .rstat .k{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-faint); margin-top:6px;}
  .rhold{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .rhold:last-of-type{border-bottom:none;}
  .rhold .rt{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; min-width:54px;}
  .rhold .rn{flex:1; font-size:12px; color:var(--ink-soft); line-height:1.35;}
  .rhold .rw{font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .rfoot{margin-top:auto; padding-top:16px;}

  /* ---- movement between steps ------------------------------------------
     Each step slides in from the direction you are travelling, so going back
     feels like going back rather than another jump forward. */
  .qwrap{animation:stepIn .34s cubic-bezier(.22,.9,.3,1) both;}
  .qwrap.rev{animation-name:stepInRev;}
  @keyframes stepIn{from{opacity:0; transform:translateX(26px);} to{opacity:1; transform:none;}}
  @keyframes stepInRev{from{opacity:0; transform:translateX(-26px);} to{opacity:1; transform:none;}}
  .rail .step-dot i{transition:background .3s, border-color .3s, color .3s, transform .3s;}
  .step-dot.on i{transform:scale(1.08);}
  @media (prefers-reduced-motion: reduce){ .qwrap{animation:none;} }

  /* ---- the flow's own buttons ------------------------------------------
     The generic dark button read as a form control from another page. These
     belong to the flow: forward is ember and weighted, back is quiet. */
  .btn-next{display:inline-flex; align-items:center; gap:10px; padding:14px 26px;
    border:none; border-radius:100px; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:500; color:var(--ink);
    background:linear-gradient(120deg, #FF8355 0%, var(--ember) 55%, var(--ember-deep) 100%);
    background-size:180% 100%; box-shadow:0 8px 22px -8px rgba(255,107,53,0.75);
    transition:transform .16s, box-shadow .16s, background-position .35s;}
  .btn-next:hover{transform:translateY(-2px); background-position:100% 50%;
    box-shadow:0 12px 28px -8px rgba(255,107,53,0.85);}
  .btn-next:active{transform:translateY(0);}
  .btn-next svg{flex:none;}
  .btn-back{display:inline-flex; align-items:center; gap:9px; padding:13px 20px;
    border-radius:100px; border:1px solid var(--line-strong); background:none;
    font-family:inherit; font-size:14px; color:var(--ink-soft); cursor:pointer;
    transition:all .16s;}
  .btn-back:hover{border-color:var(--ink); color:var(--ink); background:var(--white);
    transform:translateX(-2px);}
  .btn-quiet{background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:13.5px; color:var(--ink-faint); text-decoration:underline;
    text-underline-offset:3px; padding:13px 4px;}
  .btn-quiet:hover{color:var(--ink);}
  .navrow{display:flex; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .navrow .spacer{flex:1;}
  body.pro .btn-next{color:#1C2230;
    background:linear-gradient(120deg,#E9D6A8 0%,#C9A227 55%,#8C6B1F 100%);
    background-size:180% 100%; box-shadow:0 8px 22px -8px rgba(201,162,39,0.75);}
  body.pro .btn-next:hover{box-shadow:0 12px 28px -8px rgba(201,162,39,0.85);}

  /* --pay-neutral: emphasis comes from scale, not from a coloured panel */
  .payline{display:grid; grid-template-columns:1.15fr 1fr; gap:1px; margin:4px 0 16px;
    border-radius:11px; overflow:hidden; background:var(--line);
    border:1px solid var(--line);}
  .pay{background:var(--white); padding:15px 17px;}
  .pay .pv{font-family:'Fraunces',serif; font-size:31px; line-height:1; color:var(--ink);
    letter-spacing:-0.01em;}
  .pay.sec .pv{font-size:23px; color:var(--ink-soft);}
  .pay .pk{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--ink-faint); margin-top:8px;}
  .payon{font-size:12px; color:var(--ink-faint); margin:-8px 0 16px;}
  body.pro .payline{background:var(--gold-line); border-color:var(--gold-line);}
  body.pro .pay{background:var(--white);}
  body.pro .pay .pv{background:linear-gradient(110deg,#8C6B1F 0%,#C9A227 45%,#E9D6A8 68%,#C9A227 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  body.pro .pay.sec .pv{-webkit-text-fill-color:initial; background:none; color:var(--ink-soft);}
  @media(max-width:420px){ .payline{grid-template-columns:1fr;} }
</style>

function fmtMoney(v){

const _cache = {};
function lookThrough(t, depth, seen){
  depth = depth||0; seen = seen||new Set();
  if (depth===0 && _cache[t]) return _cache[t];
  const f = FUNDS[t], out = {};
  if (!f || !f.holdings) return out;
  seen.add(t);
  Object.entries(f.holdings).forEach(function(e){
    const k=e[0], w=e[1], nested=FUNDS[k];
    if (nested && nested.holdings && depth<3 && !seen.has(k)){
      const inner = lookThrough(k, depth+1, new Set(seen));
      const tot = Object.values(inner).reduce(function(a,b){return a+b;},0) || 1;
      Object.entries(inner).forEach(function(p){ out[p[0]] = (out[p[0]]||0) + w*(p[1]/tot); });
    } else { out[k] = (out[k]||0) + w; }
  });
  if (depth===0) _cache[t] = out;
  return out;
}
function overlapPct(a, b){
  const A1 = lookThrough(a,0,new Set()), B1 = lookThrough(b,0,new Set());
  const sa = Object.values(A1).reduce(function(x,y){return x+y;},0) || 1;
  const sb = Object.values(B1).reduce(function(x,y){return x+y;},0) || 1;
  let shared = 0;
  Object.keys(A1).forEach(function(k){ if (B1[k] !== undefined) shared += Math.min(A1[k]/sa, B1[k]/sb); });
  return shared * 100;
}
function sectorMix(tickers, weights){
  const mix = {}; let total = 0;
  tickers.forEach(function(t, i){
    const flat = lookThrough(t,0,new Set());
    const inner = Object.values(flat).reduce(function(a,b){return a+b;},0);
    if (!inner) return;
    const w = weights[i];
    total += w;
    Object.keys(flat).forEach(function(h){
      const s = SECTORS[h] || 'Unclassified';
      mix[s] = (mix[s]||0) + (flat[h]/inner) * w;
    });
  });
  if (!total) return {};
  Object.keys(mix).forEach(function(k){ mix[k] = mix[k]/total*100; });
  return mix;
}

// ---- the model ---------------------------------------------------------
// Deterministic and explainable on purpose. Every fund that appears in a
// result can be traced to the filters below, and nothing is invented: yield,
// total return and holdings all come from the tracked dataset.
function eligible(){
  const L = TIERS[tier];
  let list = Object.entries(FUNDS).filter(function(e){
    const st = e[1].stats || {};
    if (st.yield_ttm === undefined) return false;
    if (A.country === 'CAD' && e[1].region !== 'CAD') return false;
    if (A.country === 'US'  && e[1].region !== 'US')  return false;
    return true;
  });
  // the tier caps how much of the market the reader can draw on
  list.sort(function(a,b){ return ((b[1].stats||{}).aum_musd||0) - ((a[1].stats||{}).aum_musd||0); });
  return list.slice(0, L.universe);
}

function inBand(t, band){
  const y = (FUNDS[t].stats||{}).yield_ttm;
  return y >= band.lo && y < band.hi;
}

// A fund earns its place on total return, not on yield. Yield is what the
// reader asked for; total return is whether they actually kept anything.
function quality(t){
  const st = FUNDS[t].stats || {};
  const ret = (st.total_return_1y === undefined || st.total_return_1y === null) ? 0 : st.total_return_1y;
  const size = Math.log10(Math.max((st.aum_musd||10), 10));
  const holdings = Object.keys(FUNDS[t].holdings||{}).length;
  const disclosed = holdings ? 1 : 0;
  return ret + size * 1.5 + disclosed * 2;
}

function sectorFit(t){
  if (!A.sectors.length) return 0;
  const flat = lookThrough(t,0,new Set());
  const inner = Object.values(flat).reduce(function(a,b){return a+b;},0);
  if (!inner) return 0;
  let hit = 0;
  Object.keys(flat).forEach(function(h){
    if (A.sectors.indexOf(SECTORS[h] || 'Unclassified') !== -1) hit += flat[h];
  });
  return hit / inner * 100;
}

// Greedy: take the strongest fund, then keep adding whichever candidate adds
// the most new ground — high quality, low overlap with what is already in.
function assemble(pool, count, mode){
  if (!pool.length) return [];
  const picked = [];
  const scored = pool.slice().sort(function(a,b){
    if (mode === 'income') return (FUNDS[b].stats.yield_ttm) - (FUNDS[a].stats.yield_ttm);
    if (mode === 'sector') return sectorFit(b) - sectorFit(a);
    return quality(b) - quality(a);
  });
  picked.push(scored[0]);
  while (picked.length < count){
    let best = null, bestScore = -1e9;
    for (const cand of scored){
      if (picked.indexOf(cand) !== -1) continue;
      let worstOverlap = 0;
      picked.forEach(function(p){ worstOverlap = Math.max(worstOverlap, overlapPct(cand, p)); });
      const q = mode === 'income' ? FUNDS[cand].stats.yield_ttm
              : mode === 'sector' ? sectorFit(cand)
              : quality(cand);
      const score = q - worstOverlap * 0.9;
      if (score > bestScore){ bestScore = score; best = cand; }
    }
    if (!best) break;
    picked.push(best);
  }
  return picked;
}

function summarise(tickers, weights){
  let y = 0, r = 0, rCov = 0, mer = 0, merCov = 0;
  tickers.forEach(function(t, i){
    const st = FUNDS[t].stats || {};
    const w = weights[i] / 100;
    y += st.yield_ttm * w;
    if (st.total_return_1y !== undefined && st.total_return_1y !== null){ r += st.total_return_1y * w; rCov += w; }
    if (st.mer !== undefined && st.mer !== null){ mer += st.mer * w; merCov += w; }
  });
  let worst = 0, pairs = 0, sum = 0;
  for (let i=0;i<tickers.length;i++) for (let j=i+1;j<tickers.length;j++){
    const v = overlapPct(tickers[i], tickers[j]);
    worst = Math.max(worst, v); sum += v; pairs++;
  }
  return {yield:y, ret: rCov ? r/rCov : null, mer: merCov ? mer/merCov : null,
          overlapAvg: pairs ? sum/pairs : 0, overlapWorst: worst,
          income: A.amount ? A.amount * y / 100 : null};
}

// Three portfolios, each honest about what it is optimising for.
function relaxBand(pool, band){
  // Widen in steps rather than abandoning the answer entirely: the band
  // itself, then a few points either side, and only then the whole market.
  if (!band) return {pool: pool, how: 'none', range: null};
  const strict = pool.filter(function(t){ return inBand(t, band); });
  if (strict.length >= 4) return {pool: strict, how: 'none', range: [band.lo, band.hi]};
  const widths = [3, 6, 10];
  for (const w of widths){
    const lo = Math.max(0, band.lo - w), hi = band.hi + w;
    const near = pool.filter(function(t){
      const y = (FUNDS[t].stats||{}).yield_ttm;
      return y >= lo && y < hi;
    });
    if (near.length >= 4) return {pool: near, how: 'widened', range: [lo, hi]};
  }
  return {pool: pool, how: 'all', range: null};
}

function buildRecommendations(){
  const pool = eligible().map(function(e){ return e[0]; });
  const band = BANDS.find(function(b){ return b.id === A.yieldBand; });
  const relaxed = relaxBand(pool, band);
  const working = relaxed.pool;

  // Someone who asked for 15-20% should never be handed a 58% fund, even if
  // the search had to widen to find enough candidates.
  const ceiling = band ? band.hi : Infinity;
  const capped = band ? working.filter(function(t){ return (FUNDS[t].stats||{}).yield_ttm < ceiling; }) : working;
  const incomePool = capped.length >= 3 ? capped : working;
  const cappedApplied = band && capped.length >= 3;

  const size = Math.min(4, Math.max(3, working.length));
  const specs = [
    {tag:'Balanced', pool:working, mode:'quality',
     desc:'Built on total return first, then spread out so the funds are not buying the same companies.'},
    {tag:'Income first', pool:incomePool, mode:'income',
     desc: cappedApplied
       ? 'The highest yields available without going past the ' + band.label + ' you asked for.'
       : 'Leans into the highest yields your answers allow. Check the total return line before you act on it.'},
    {tag:'Spread widest', pool:working, mode:'sector',
     desc: A.sectors.length
       ? 'Weighted towards the sectors you chose, while keeping overlap down.'
       : 'Deliberately picks funds that hold different things, so one bad sector does not take the whole portfolio with it.'}
  ];
  return specs.map(function(spec){
    const picks = assemble(spec.pool, Math.min(size, spec.pool.length), spec.mode);
    const w = picks.map(function(){ return Math.round(1000 / picks.length) / 10; });
    return {tag:spec.tag, desc:spec.desc, picks:picks, weights:w,
            stats:summarise(picks, w), relaxed:relaxed, band:band};
  });
}

    const overBand = r.band && s.yield > r.band.hi + 0.05;
    html += '<div class="rec' + (ix===0?' best':'') + '">'
      + '<div class="rtag">' + r.tag + (ix===0 ? ' · our pick' : '') + '</div>'
      + '<h3>' + fmtPct(s.yield) + ' a year</h3>'
      + '<p class="rdesc">' + r.desc + '</p>'
      + '<div class="rstats">'
        + '<div class="rstat"><div class="v">' + fmtPct(s.yield) + '</div><div class="k">blended yield</div></div>'
        + '<div class="rstat"><div class="v" style="color:' + (s.ret !== null && s.ret < 0 ? 'var(--down)' : 'var(--up)') + '">'
          + (s.ret === null ? '—' : fmtPct(s.ret)) + '</div><div class="k">total return 1y</div></div>'
        + '<div class="rstat"><div class="v">' + Math.round(s.overlapAvg) + '%</div><div class="k">avg overlap</div></div>'
      + '</div>';
    if (A.amount){
      html += '<div class="payline">'
        + '<div class="pay"><div class="pv">' + fmtMoney(s.income/12) + '</div>'
        + '<div class="pk">income a month</div></div>'
        + '<div class="pay sec"><div class="pv">' + fmtMoney(s.income) + '</div>'
        + '<div class="pk">income a year</div></div>'
        + '</div>'
        + '<div class="payon">on ' + fmtMoney(A.amount) + ' invested</div>';
    }
    r.picks.forEach(function(t, i){
      const f = FUNDS[t];
      html += '<div class="rhold"><span class="rt" style="color:' + famColour(f.issuer) + '">' + t + '</span>'
        + '<span class="rn">' + f.name + '</span><span class="rw">' + r.weights[i] + '%</span></div>';
    });
    if (overBand){
      html += '<div class="disclaim" style="margin-top:14px;font-size:12.5px">'
        + '<b>Above your band:</b> this blends to ' + fmtPct(s.yield) + ', past the '
        + r.band.label + ' you picked. There were not enough funds inside the band to build '
        + 'a spread portfolio without going over.</div>';
    }
    if (eroding){
      html += '<div class="disclaim hot" style="margin-top:14px;font-size:12.5px">'
        + '<b>Worth pausing on:</b> this pays ' + fmtPct(s.yield) + ' but returned '
        + fmtPct(s.ret) + ' in total over the past year. The gap is capital coming back to you, '
        + 'not profit.</div>';
    }
    html += '<div class="rfoot"><button class="btn-next" style="width:100%;justify-content:center" data-ix="' + ix + '">Use this portfolio'
      + '<svg width="15" height="10" viewBox="0 0 15 10" fill="none"><path d="M1 5h12M9.5 1.5 13 5l-3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>'
      + '</div>';
  });
  html += '</div>';

  html += '<div class="navrow">'
    + '<button class="btn-back" id="back">' + '<svg width="15" height="10" viewBox="0 0 15 10" fill="none"><path d="M14 5H2M5.5 1.5 2 5l3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>' + 'Change my answers</button>'
    + '<button class="btn-quiet" id="restart">Start again</button>'
    + '<span class="spacer"></span>'
    + '<a class="btn-back" href="portfolio.html">Go to My Portfolio</a></div>'
    + '<p class="foot" style="margin-top:26px;font-size:12px;color:var(--ink-faint);line-height:1.7;max-width:74ch">'
    + 'These portfolios are assembled by a simple rules-based model from published fund data: '
    + 'trailing yield, one year total return, and what each fund holds underneath. They are a starting '
    + 'point for your own research, not financial advice, and no one at Licentia knows your tax position, '
    + 'time horizon or anything else about your circumstances. Past distributions do not predict future ones.'
    + '</p></div>';

  box.innerHTML = html;
  applyDirection(box);
  window.__recs = recs;
  const rb = document.getElementById('back');
  if (rb) rb.addEventListener('click', function(){ goTo(3); });
  box.querySelectorAll('.rfoot .btn-next').forEach(function(b){
    b.addEventListener('click', function(){ useRec(Number(b.dataset.ix)); });
  });
  const rs = document.getElementById('restart');
  if (rs) rs.addEventListener('click', function(){
    A.country=null; A.amount=null; A.yieldBand=null; A.sectors=[]; A.auto=false; stepIx=0; render();
  });
}

function fmtPct(v){ return (v===null||v===undefined||!isFinite(v)) ? '—' : v.toFixed(1) + '%'; }

async function useRec(ix){
  const r = window.__recs[ix];
  const s = await sb.auth.getSession();
  if (!s.data.session){
    alert('Sign in first and this will save straight to My Portfolio.');
    window.location.href = 'account.html';
    return;
  }
  if (!A.amount){
    alert('Go back and enter an amount so we can work out how many shares that is.');
    return;
  }
  // weights become share counts at today's price, so the saved rows mean something
  const rows = r.picks.map(function(t, i){
    const price = (FUNDS[t].stats||{}).price;
    if (!price) return null;
    const dollars = A.amount * r.weights[i] / 100;
    return {user_id: s.data.session.user.id, ticker: t,
            shares: Math.floor(dollars / price), cost_basis: price};
  }).filter(Boolean);
  if (!rows.length){ alert('No prices available for those funds right now.'); return; }
  const res = await sb.from('portfolio_holdings').insert(rows);
  if (res.error){ alert(res.error.message); return; }
  window.location.href = 'portfolio.html';
}

Promise.all([
  fetch('data/funds.json?cb=' + Math.random()).then(function(r){ return r.json(); }),
  fetch('data/sectors.json?cb=' + Math.random()).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
  fetch('data/aum_patch.json?cb=' + Math.random()).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }),
  sb.auth.getSession()
]).then(function(res){
  FUNDS = res[0];
  SECTORS = (res[1] && res[1].map) ? res[1].map : {};
  const patch = res[2] || {};
  Object.keys(patch).forEach(function(t){
    if (FUNDS[t]){ FUNDS[t].stats = FUNDS[t].stats || {};
      if (FUNDS[t].stats.aum_musd == null) FUNDS[t].stats.aum_musd = patch[t].aum_musd; }
  });
  tier = PREVIEW_PRO ? 'paid' : (res[3].data.session ? 'member' : 'free');
  render();
});

sb.auth.onAuthStateChange(function(_e, session){
  tier = PREVIEW_PRO ? 'paid' : (session ? 'member' : 'free');
  if (Object.keys(FUNDS).length) render();
});
</script>
