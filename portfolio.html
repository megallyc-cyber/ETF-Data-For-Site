<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio — Licentia</title>
  <meta name="description" content="Track what your income funds are worth, what they pay a year, and what you are earning on the money you put in.">
  <link rel="canonical" href="https://licentia.ca/portfolio.html">

  <meta property="og:title" content="My Portfolio — Licentia">
  <meta property="og:description" content="Track what your income funds are worth, what they pay a year, and what you are earning on the money you put in.">
  <meta property="og:url" content="https://licentia.ca/portfolio.html">

  <meta name="twitter:description" content="Track what your income funds are worth, what they pay a year, and what you are earning on the money you put in.">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE9; --paper-raised:#FBF9F5; --white:#FFFFFF;
    --ink:#1C2230; --ink-soft:#4A5262; --ink-faint:#8A9099;
    --ember:#FF6B35; --ember-deep:#D4501F;
    --gold:#FF6B35; --gold-deep:#D4501F;
    --teal:#2F3E57; --teal-deep:#1C2230;
    --rust:#E5484D; --up:#4CB782; --down:#E5484D;
    --line:rgba(28,34,48,0.13); --line-strong:rgba(28,34,48,0.26);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink);
    font-family:'Inter',ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;}
  nav{display:flex; align-items:center; justify-content:space-between; gap:28px;
    padding:15px 30px; position:sticky; top:0; z-index:40; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(242,239,233,0.97) 0%, rgba(242,239,233,0.86) 100%);
    -webkit-backdrop-filter:saturate(150%) blur(14px);
    backdrop-filter:saturate(150%) blur(14px);
    border-bottom:1px solid var(--line);}
  nav .brand{font-family:'Space Grotesk',ui-sans-serif,sans-serif; font-weight:700;
    font-size:19px; letter-spacing:-0.02em; color:var(--ink); text-decoration:none;
    display:inline-flex; align-items:center;}
  .brand-bird{display:inline-block; width:25px; height:16px; margin-left:8px; vertical-align:-1px;}
  .navlinks{display:flex; gap:26px; flex-wrap:wrap; align-items:center;}
  .navlinks a{font-family:'Inter',ui-sans-serif,sans-serif; font-size:14px;
    padding:5px 0; text-decoration:none; border:none; border-radius:0;
    color:var(--ink-soft); white-space:nowrap; position:relative; transition:color .16s;}
  /* the underline marks the page you are on and previews the one you are opening */
  .navlinks a::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    border-radius:2px; background:var(--ember); transform:scaleX(0);
    transform-origin:left center; transition:transform .2s ease;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks a:hover::after{transform:scaleX(0.45);}
  .navlinks a.active{color:var(--ink); font-weight:500;}
  .navlinks a.active::after{transform:scaleX(1);}
  @media(max-width:820px){ nav{padding:12px 16px; gap:16px;} .navlinks{gap:15px;} .navlinks a{font-size:12.5px;} }

  .wrap{max-width:1180px; margin:0 auto; padding:36px 26px 90px;}
  .head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,3.4vw,40px);
    letter-spacing:-0.02em; line-height:1.1; margin-bottom:8px;}
  .sub{font-size:15px; color:var(--ink-soft); line-height:1.6; max-width:62ch;}
  .tier{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:10px;
    padding:14px 26px; border-radius:100px; color:var(--paper);
    background:linear-gradient(115deg, var(--ink) 0%, #33405C 45%, var(--ink) 100%);
    background-size:220% 100%; animation:tierdrift 9s ease-in-out infinite;
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.12em;
    text-transform:uppercase; white-space:nowrap; box-shadow:0 6px 18px rgba(28,34,48,0.20);}
  .tier b{color:var(--ember); font-weight:500; letter-spacing:0.06em;}
  @keyframes tierdrift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @media (prefers-reduced-motion: reduce){ .tier{animation:none;} }
  .panel{background:var(--white); border:1px solid var(--line); border-radius:13px;
    padding:22px 24px; margin-top:22px;}
  .panel h2{font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin-bottom:4px;}
  .panel .note{font-size:13px; color:var(--ink-faint); line-height:1.55; margin-bottom:16px;}
  /* auto-fit left an odd number of cells on the last row depending on width;
     a fixed count keeps the six figures in a deliberate arrangement. */
  .totals{display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; margin-top:26px;}
  @media(max-width:900px){ .totals{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .totals{grid-template-columns:1fr;} }
  .tot{background:var(--white); padding:18px 20px; min-height:104px;
    display:flex; flex-direction:column; justify-content:center;}
  .tot .v{font-family:'Fraunces',serif; font-size:27px; line-height:1;}
  .tot .v.up{color:var(--up);} .tot .v.down{color:var(--down);}
  .tot .v.small{font-size:14px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}
  .tot .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.11em;
    text-transform:uppercase; color:var(--ink-faint); margin-top:8px;}
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.11em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:400;
    padding:0 10px 10px; border-bottom:1px solid var(--line);}
  th.r, td.r{text-align:right;}
  td{padding:13px 10px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tic{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:14px;}
  .nm{font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .num{font-family:'IBM Plex Mono',monospace; font-size:13.5px;}
  .pos{color:var(--up);} .neg{color:var(--down);}
  .rowbtn{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:16px; padding:2px 5px;}
  .rowbtn:hover{color:var(--rust);}
  .addform{display:grid; grid-template-columns:1.4fr 1fr 1fr auto; gap:10px; align-items:end;}
  @media(max-width:760px){ .addform{grid-template-columns:1fr;} }
  label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  input, select{width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line-strong);
    background:var(--paper-raised); font-family:inherit; font-size:14.5px; color:var(--ink);}
  input:focus, select:focus{outline:none; border-color:var(--ember); box-shadow:0 0 0 3px rgba(255,107,53,0.15);}
  .primary{padding:12px 22px; border:none; border-radius:9px; cursor:pointer;
    background:var(--ink); color:var(--paper); font-family:inherit; font-size:14.5px;
    font-weight:500; transition:transform .16s, box-shadow .16s; white-space:nowrap;}
  .primary:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,34,48,0.18);}
  .primary:disabled{opacity:.55; cursor:wait; transform:none;}
  .ghost{display:inline-block; padding:11px 20px; border-radius:9px; border:1px solid var(--line-strong);
    background:none; font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer;
    text-decoration:none; transition:all .16s;}
  .ghost:hover{border-color:var(--ink); background:var(--white);}
  .empty{padding:38px 24px; text-align:center; color:var(--ink-faint); font-size:14px; line-height:1.7;}
  .gate{max-width:560px; margin:70px auto; text-align:center;}
  .gate p{font-size:15px; color:var(--ink-soft); line-height:1.7; margin-bottom:26px;}
  .msg{margin-top:14px; padding:12px 14px; border-radius:9px; font-size:13.5px; line-height:1.5;}
  .msg.bad{background:rgba(229,72,77,0.10); color:#A32C31; border:1px solid rgba(229,72,77,0.28);}
  .msg.good{background:rgba(76,183,130,0.12); color:#2C7A55; border:1px solid rgba(76,183,130,0.30);}
  .foot{margin-top:30px; font-size:12px; color:var(--ink-faint); line-height:1.7; max-width:72ch;}

  .fundpicker{position:relative;}
  .pickchosen{display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:9px;
    border:1px solid rgba(var(--famrgb),0.34); background:linear-gradient(150deg,
      rgba(var(--famrgb),0.13) 0%, rgba(var(--famrgb),0.03) 60%, rgba(255,255,255,0.8) 100%);}
  .pickchosen .ct{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:14px;}
  .pickchosen .cn{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .pickchosen .cx{background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-size:17px; padding:0 3px;}
  .pickchosen .cx:hover{color:var(--rust);}
  .pickmenu{position:absolute; z-index:30; left:0; right:0; top:calc(100% + 6px);
    background:var(--white); border:1px solid var(--line-strong); border-radius:11px;
    box-shadow:0 14px 34px rgba(28,34,48,0.16); overflow:hidden; max-height:340px; overflow-y:auto;}
  .pickrow{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:11px 13px; border:none; background:none; cursor:pointer; font-family:inherit;
    border-left:3px solid var(--fam); border-bottom:1px solid var(--line);}
  .pickrow:last-child{border-bottom:none;}
  .pickrow:hover, .pickrow.active{background:rgba(var(--famrgb),0.10);}
  .pickrow .pt{font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:500; min-width:56px;}
  .pickrow .pn{flex:1; font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .pickrow .py{font-family:'Fraunces',serif; font-size:16px; color:var(--fam);}
  .picknone{padding:14px 15px; font-size:13px; color:var(--ink-faint);}
  .pickhint{position:absolute; top:calc(100% + 5px); left:0;
    font-size:11.5px; color:var(--ink-faint); white-space:nowrap; pointer-events:none;}
  .addform{align-items:end;}
  .addform > div{min-width:0;}
  .fundpicker{position:relative; padding-bottom:0;}
  /* every control on the row ends up the same height */
  .fundpicker input, .pickchosen{height:44px;}
  .addform input, .addform .primary{height:44px;}
  .pickchosen{box-sizing:border-box;}
  /* 2. group the matches by manager so a long list reads as a set of houses */
  .pickgroup{padding:9px 13px 5px; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
    letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-faint);
    background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0;}
  .pickgroup i{display:inline-block; width:7px; height:7px; border-radius:2px;
    margin-right:7px; background:var(--fam); vertical-align:0;}

  .lock-modal{position:fixed; inset:0; z-index:200; display:flex; align-items:center;
    justify-content:center; padding:22px; background:rgba(28,34,48,0.42);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  .lock-modal .lm-card{background:var(--white); border:1px solid var(--line-strong);
    border-radius:16px; padding:26px; max-width:400px; width:100%;}
  .lm-tick{font-family:'Fraunces',serif; font-size:24px; margin-bottom:8px;}
  .lm-copy{font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin-bottom:20px;}
  .lm-row{display:flex; align-items:center; gap:14px;}
  .lm-go{flex:none; padding:11px 20px; border-radius:100px; text-decoration:none;
    background:linear-gradient(135deg,#C89B3C,#8F6B22); color:#fff; font-size:13.5px;}
  .lm-no{background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:13.5px; color:var(--ink-faint);}

  /* a number you can click, without shouting about it until you hover */
  .cellEdit{cursor:text; border-bottom:1px dashed transparent; padding-bottom:1px;}
  .cellEdit:hover{border-bottom-color:var(--line-strong);}
  .cellEdit.isblank{color:var(--ink-faint); font-style:italic;}
  #rows.editing .cellEdit:has(input)::after{display:none;}
  .cellInput{width:88px; padding:3px 6px; font-family:inherit; font-size:13.5px;
    text-align:right; border:1px solid var(--ink); border-radius:6px;
    background:var(--white); color:var(--ink);}
  .cellInput:focus{outline:none;}
  .panel-top{display:flex; align-items:center; justify-content:space-between;
    gap:14px; margin-bottom:2px;}
  .panel-top h2{margin-bottom:0;}
  .editToggle{flex:none; padding:7px 15px; border-radius:100px; cursor:pointer;
    font-family:inherit; font-size:12.5px; color:var(--ink);
    background:none; border:1px solid var(--line-strong); transition:all .16s;}
  .editToggle:hover{border-color:var(--ink);}
  .editToggle.is-on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  /* Reading mode leaves the numbers as numbers. */
  #rows .cellEdit{cursor:default; border:1px solid transparent; padding:2px 4px;}

  /* In edit mode they become plainly fields: a box, a light surface and a
     caret. Anything less and people do not know they can type in them. */
  #rows.editing .cellEdit{cursor:text; display:inline-block; min-width:74px;
    padding:4px 8px; border:1px solid var(--line-strong); border-radius:7px;
    background:var(--white); text-align:right;
    box-shadow:inset 0 1px 2px rgba(28,34,48,0.06);}
  #rows.editing .cellEdit:hover{border-color:var(--ink);}
  #rows.editing .cellEdit::after{content:"✎"; margin-left:6px; font-size:10px;
    color:var(--ink-faint); vertical-align:1px;}
  #rows.editing .cellEdit:hover::after{color:var(--ember-deep);}
  #rows.editing .cellEdit.isblank{color:var(--ember-deep); font-style:normal;}
  /* the whole row lifts a little so it is obvious which one is live */
  #rows.editing tbody tr:hover{background:rgba(255,107,53,0.04);}
  #rows .rowbtn{visibility:hidden;}
  #rows.editing .rowbtn{visibility:visible;}
  .lic-toast{position:fixed; left:50%; bottom:34px; z-index:300;
    display:flex; align-items:center; gap:9px;
    padding:12px 20px; border-radius:100px;
    background:var(--ink); color:var(--paper); font-size:14px;
    box-shadow:0 14px 34px -14px rgba(28,34,48,0.7);
    transform:translate(-50%, 18px) scale(0.96); opacity:0; pointer-events:none;
    transition:transform .34s cubic-bezier(.16,1,.3,1), opacity .28s ease;}
  .lic-toast.show{transform:translate(-50%, 0) scale(1); opacity:1;}
  .lic-toast .lt-tick{display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; border-radius:50%; background:var(--ember-deep);
    color:#fff; font-size:11px;}
  body.pro .lic-toast .lt-tick{background:linear-gradient(135deg,#C89B3C,#8F6B22);}
  @media (prefers-reduced-motion: reduce){
    .lic-toast{transition:opacity .2s ease;}
    .lic-toast.show{transform:translate(-50%, 0) scale(1);}}

  .share-modal{position:fixed; inset:0; z-index:320; display:flex; align-items:center;
    justify-content:center; padding:clamp(12px,3vh,40px); background:rgba(28,34,48,0.5);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    opacity:0; transition:opacity .22s ease;}
  .share-modal.in{opacity:1;}
  .sm-card{width:min(760px,96vw); max-height:92vh; overflow:auto; background:var(--paper);
    border:1px solid var(--line-strong); border-radius:16px;
    box-shadow:0 30px 70px -28px rgba(28,34,48,0.75);}
  .sm-bar{display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line); background:var(--white);}
  .sm-bar b{font-weight:500; font-size:15px;}
  .sm-x{width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:19px;
    line-height:1; background:none; border:1px solid var(--line-strong); color:var(--ink);}
  .sm-x:hover{background:var(--ink); color:var(--paper);}
  .sm-body{padding:18px;}
  .sm-preview canvas{display:block; box-shadow:0 10px 26px -14px rgba(28,34,48,0.55);}
  .sm-toggle{display:flex; align-items:center; gap:9px; margin-top:16px; font-size:14px;
    cursor:pointer;}
  .sm-note{margin:6px 0 0; font-size:12.5px; color:var(--ink-faint); line-height:1.5;}
  .sm-acts{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .sm-go{padding:11px 20px; border-radius:100px; cursor:pointer; border:none;
    background:var(--ink); color:var(--paper); font-family:inherit; font-size:14px;}
  .sm-alt{padding:11px 20px; border-radius:100px; cursor:pointer; font-family:inherit;
    font-size:14px; background:none; border:1px solid var(--line-strong); color:var(--ink);}
  .sm-go:hover{filter:brightness(1.15);} .sm-alt:hover{border-color:var(--ink);}
  .share-open{margin-left:8px;}
  @media(max-width:560px){
    .sm-body{padding:14px;}
    .sm-acts{flex-direction:column;}
    .sm-go, .sm-alt{width:100%;}
  }


  .sm-where{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px;
    padding-top:14px; border-top:1px solid var(--line);}
  .sm-where span{font-size:12.5px; color:var(--ink-faint); margin-right:2px;}
  .sp-link{font-size:13px; text-decoration:none; color:var(--ink-soft);
    padding:6px 12px; border-radius:100px; border:1px solid var(--line-strong);}
  .sp-link:hover{border-color:var(--ink); color:var(--ink);}
  .sm-hide{display:none;}


  .sm-toggle{display:flex; align-items:center; gap:10px; margin-top:16px;
    font-size:14px; cursor:pointer; line-height:1.4;}
  .sm-toggle input[type="checkbox"]{flex:none; width:17px; height:17px; margin:0;
    padding:0; border:1px solid var(--line-strong); border-radius:4px;
    accent-color:var(--ink); cursor:pointer; appearance:auto; min-width:0;}
  .sm-toggle span{flex:1;}


  .share-open{background:var(--ink) !important; color:var(--paper) !important;
    border-color:var(--ink) !important; font-weight:500;}
  .share-open:hover{filter:brightness(1.2);}
  .share-open::before{content:"\2191"; margin-right:7px; display:inline-block;}
  .sm-copied{margin-top:10px; font-size:12.5px; color:var(--ink-soft); opacity:0;
    transition:opacity .2s ease;}
  .sm-copied.on{opacity:1;}
  .sp-link{background:none; font-family:inherit; cursor:pointer;}


  /* The badge said "Account", which told a reader nothing they did not already
     know. It now carries the standing the portfolio has earned, in the metal
     that goes with it. */
  #tierBadge.t-platinum{
    /* the metal has to keep moving: a background shorthand resets
       background-size, which left the sheen frozen in place */
    background-image:linear-gradient(115deg,#6E747E 0%,#AEB6C0 42%,#F2F5F8 62%,#AEB6C0 82%,#6E747E 100%);
    background-size:220% 100%; animation:tierdrift 9s ease-in-out infinite;
    color:#1C2230; box-shadow:0 6px 18px rgba(110,116,126,0.28);}
  #tierBadge.t-platinum-plus{
    background-image:linear-gradient(115deg,#3E4756 0%,#8892A3 40%,#E4E9F0 62%,#8892A3 82%,#3E4756 100%);
    background-size:220% 100%; animation:tierdrift 8s ease-in-out infinite;
    color:#141A25; box-shadow:0 6px 18px rgba(62,71,86,0.32);}
  #tierBadge.t-generational{
    background-image:linear-gradient(115deg,#7A5C15 0%,#C9A227 40%,#F6E9C2 62%,#C9A227 82%,#7A5C15 100%);
    background-size:220% 100%; animation:tierdrift 7s ease-in-out infinite;
    color:#2A2008; box-shadow:0 6px 20px rgba(140,107,31,0.34);}
  #tierBadge.t-diamond{
    background-image:linear-gradient(115deg,#4A6C93 0%,#8FA8C8 36%,#FFFFFF 60%,#8FA8C8 82%,#4A6C93 100%);
    background-size:220% 100%; animation:tierdrift 6s ease-in-out infinite;
    color:#10202F; box-shadow:0 6px 22px rgba(91,127,166,0.38);}
  #tierBadge.t-platinum b, #tierBadge.t-platinum-plus b,
  #tierBadge.t-generational b, #tierBadge.t-diamond b{color:inherit; opacity:0.62;}

  .title-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:relative;}
  .title-row h1{margin-bottom:0;}
  .tier{cursor:pointer; font:inherit; font-family:"IBM Plex Mono",monospace;

function licentiaAuthHeader(){
  // pro.js renews the session; a token older than an hour is rejected by
  // the endpoint, which is what used to lock the Pro funds mid-session.
  if (typeof window.licentiaRefreshSession === "function") {
    return window.licentiaRefreshSession(false);
  }
  return Promise.resolve(licentiaToken());
}
function licentiaToken(){
  try {
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (!/auth-token/.test(k)) continue;
      var v = JSON.parse(localStorage.getItem(k));
      return v.access_token || (v.currentSession || {}).access_token || null;
    }
  } catch(e){}
  return null;
}
function licentiaSeed(){
  try {
    var d = localStorage.getItem('licentia_device');
    if (!d){ d = String(Date.now()) + Math.random().toString(36).slice(2);
      localStorage.setItem('licentia_device', d); }
    return d;
  } catch(e){ return 'device'; }
}
async function licentiaFundsFetch(opts){
  var headers = { 'Content-Type': 'application/json' };
  var t = await licentiaAuthHeader();
  if (t) headers['Authorization'] = 'Bearer ' + t;
  var body = { seed: licentiaSeed() };
  if (opts && opts.sectors) body.sectors = true;
  return fetch('https://sopzbiuwakowbuqgwpmg.supabase.co/functions/v1/funds', {
    method: 'POST', headers: headers, body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(j){
    window.LICENTIA_DATA = { tier: j.tier, total: j.total || 0,
      shown: j.shown || 0, freeOpens: j.freeOpens || 50 };
    window.LICENTIA_TOTALS = j.totals || null;
    window.LICENTIA_SECTORS = j.sectors || null;
    window.LICENTIA_LOCKED = {};
    (j.locked || []).forEach(function(f){ window.LICENTIA_LOCKED[f.ticker] = f; });
    var out = {};
    (j.funds || []).forEach(function(f){ out[f.ticker] = f; });
    // shaped like a Response: pages check r.ok before reading the body
    return { ok: true, status: 200, json: function(){ return Promise.resolve(out); } };
  });
}

function money(v, dp){
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits: dp === undefined ? 0 : dp,
                                          maximumFractionDigits: dp === undefined ? 0 : dp});
}
function pct(v, dp){ return (v === null || v === undefined || !isFinite(v)) ? '—' : v.toFixed(dp === undefined ? 1 : dp) + '%'; }

// One position's worth, income and profit. Price and yield come from the same
// dataset the rest of the site uses.
// some issuers hand us a formatted string rather than a number: a yield of
// "39.02%", a NAV of "$27.63". One NaN in the sum blanks the whole page.
function num(v){
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : null;
}

function derive(row){
  const f = FUNDS[row.ticker] || null;
  const st = f ? (f.stats || {}) : {};
  // fall back to the NAV the issuer publishes when no market price is stored:
  // a holding worth nothing is a worse answer than one valued at NAV
  const price = num(st.price) !== null ? num(st.price) : num(st.nav);
  const shares = Number(row.shares) || 0;
  const cost = row.cost_basis === null || row.cost_basis === undefined ? null : Number(row.cost_basis);
  const value = (price !== undefined && price !== null) ? shares * price : null;
  // what the fund actually paid per share over the last twelve months is a
  // better basis than a yield derived from a price we may not have
  const ttm = num(st.ttm_total), yTtm = num(st.yield_ttm), yPub = num(st.yield);
  const income = ttm !== null ? shares * ttm
    : ((value !== null && yTtm !== null) ? value * yTtm / 100
      : ((value !== null && yPub !== null) ? value * yPub / 100 : null));
  // and show a yield even when it had to be worked out from NAV
  const yieldShown = yTtm !== null ? yTtm
    : ((ttm !== null && price) ? Math.round(ttm / price * 1000) / 10
      : (yPub !== null ? yPub : undefined));
  const spent = (cost !== null) ? shares * cost : null;
  const pl = (value !== null && spent !== null) ? value - spent : null;
  const plPct = (pl !== null && spent) ? pl / spent * 100 : null;
  const yoc = (income !== null && spent) ? income / spent * 100 : null;
  return {fund:f, price:price, shares:shares, cost:cost, value:value,
          income:income, spent:spent, pl:pl, plPct:plPct, yoc:yoc, yieldNow:yieldShown};
}

// Type-ahead over the tracked funds. Matches on ticker first, then on name,
// so "hm" finds HMAX before it finds anything merely containing those letters.
let CHOSEN = null;
const FAM = {'BMO ETFs':'#0075BE','Hamilton ETFs':'#123D66','Harvest ETFs':'#C9821F',
  'Evolve ETFs':'#0F9B8E','Purpose Investments':'#E2571E','Global X Canada':'#1B6AC9',

  'Defiance':'#B3142F','REX Shares':'#0E6E70','ProShares':'#00539B',
  'Amplify ETFs':'#6E4B9E','Goldman Sachs':'#1B3A6B'};
function famC(i){ return FAM[i] || '#2F3E57'; }
function famRgb(h){ const n=parseInt(h.slice(1),16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
function paintEl(el, issuer){ const c=famC(issuer); el.style.setProperty('--fam',c); el.style.setProperty('--famrgb',famRgb(c)); }

function matches(q){
  q = q.trim().toUpperCase();
  const all = Object.entries(FUNDS);
  if (!q) return all.slice().sort(function(a,b){
    return ((b[1].stats||{}).aum_musd||0) - ((a[1].stats||{}).aum_musd||0);
  }).slice(0, 200);
  const starts = [], contains = [], named = [];
  all.forEach(function(e){
    const t = e[0].toUpperCase(), n = (e[1].name||'').toUpperCase();
    if (t.indexOf(q) === 0) starts.push(e);
    else if (t.indexOf(q) !== -1) contains.push(e);
    else if (n.indexOf(q) !== -1) named.push(e);
  });
  const ranked = starts.concat(contains, named).slice(0, 200);
  // hold each manager's funds together without losing the ranking order
  const seen = [], byIssuer = {};
  ranked.forEach(function(e){
    const k = e[1].issuer;
    if (!byIssuer[k]){ byIssuer[k] = []; seen.push(k); }
    byIssuer[k].push(e);
  });
  return seen.reduce(function(acc, k){ return acc.concat(byIssuer[k]); }, []);
}

// ---------------------------------------------------------------------------
// A portfolio worth showing someone.
//
// Drawn on a canvas rather than screenshotted so it is legible at the sizes
// social platforms actually serve, and so the dollar figures can be left out:
// plenty of people will share a yield who would never post their balance.
// ---------------------------------------------------------------------------
const SHARE_W = 1200, SHARE_H = 675;   // 16:9, which every platform crops kindly

function shareCardData(){
  // derive drops the ticker, so pair each result back with the row it came from
  const rows = ROWS.map(function(r){
    const d = derive(r);
    if (!d) return null;
    d.t = r.ticker;
    return d;
  }).filter(Boolean);
  let value = 0, income = 0, known = false;
  rows.forEach(function(d){
    if (d.value !== null){ value += d.value; known = true; }
    if (d.income !== null && isFinite(d.income)) income += d.income;
  });
  const mix = rows.filter(function(d){ return d.value; })
    .map(function(d){ return {t:d.t, pct: value ? d.value / value * 100 : 0}; })
    .sort(function(a,b){ return b.pct - a.pct; });
  let underlying = 0;
  const seen = {};
  rows.forEach(function(d){
    const f = FUNDS[d.t];
    if (f && f.holdings) Object.keys(f.holdings).forEach(function(h){ seen[h] = 1; });
  });
  underlying = Object.keys(seen).length;
  return {value: known ? value : null, income: income, mix: mix,
          funds: rows.length, underlying: underlying,
          yield: value ? income / value * 100 : null};
}

// A portfolio worth showing deserves a name. The thresholds are on what the
// holdings are worth today, and the badge shows even when the dollar figures
// are hidden — the whole point is to say something without saying the number.
const TIERS = [
  {floor: 1000000, name: "Diamond",       ink: "#8FA8C8", glow: "#E8F0FA"},
  {floor:  500000, name: "Generational",  ink: "#C89B3C", glow: "#FBF3DE"},
  {floor:  250000, name: "Platinum Plus", ink: "#7D8794", glow: "#EEF1F5"},
  {floor:  100000, name: "Platinum",      ink: "#8A9099", glow: "#F1F2F4"}
];

function tierFor(value){
  if (!value) return null;
  for (const t of TIERS){ if (value >= t.floor) return t; }

}

    const ry = listTop + 34 + row * rowH;

    x.fillStyle = shades[i % shades.length];
    if (x.roundRect){ x.beginPath(); x.roundRect(rx, ry - 11, 4, 15, 2); x.fill(); }
    else { x.fillRect(rx, ry - 11, 4, 15); }

    x.fillStyle = "#1C2230";
    x.font = "600 17px Inter, sans-serif";
    x.fillText(m.t || "", rx + 16, ry);

    // the share of the portfolio, right-aligned within the column
    x.fillStyle = "#4A5262";
    x.font = "17px Inter, sans-serif";
    x.textAlign = "right";
    x.fillText(m.pct.toFixed(0) + "%", rx + colW - 40, ry);
    x.textAlign = "left";

    // a slim proportion bar under each name
    x.fillStyle = "rgba(28,34,48,0.08)";
    x.fillRect(rx + 16, ry + 7, colW - 96, 3);
    x.fillStyle = shades[i % shades.length];
    x.fillRect(rx + 16, ry + 7, Math.max((colW - 96) * m.pct / 100, 2), 3);
  });

  if (d.mix.length > 8){
    x.fillStyle = "#8A9099";
    x.font = "13px Inter, sans-serif";
    x.fillText("and " + (d.mix.length - 8) + " more", 64, listTop + 34 + 4 * rowH + 4);
  }

  x.fillStyle = "#1C2230";
  x.fillRect(0, SHARE_H - FOOT, SHARE_W, FOOT);

  let textX = 64;
  if (SHARE_BIRD){
    const bw2 = 46, bh2 = 30;
    x.drawImage(SHARE_BIRD, 64, SHARE_H - FOOT + 22, bw2, bh2);
    textX = 64 + bw2 + 16;
  }
  x.font = "600 30px Inter, sans-serif";
  x.fillStyle = "#FBF9F5";
  x.fillText("Licentia", textX, SHARE_H - FOOT + 46);

  x.fillStyle = "rgba(251,249,245,0.62)";
  x.font = "15px Inter, sans-serif";
  x.fillText("Every covered call and income ETF in Canada and the US", textX, SHARE_H - FOOT + 72);

  x.textAlign = "right";
  x.fillStyle = "#FBF9F5";
  x.font = "600 22px Inter, sans-serif";
  x.fillText("licentia.ca", SHARE_W - 64, SHARE_H - FOOT + 46);
  x.fillStyle = "rgba(251,249,245,0.5)";
  x.font = "13px Inter, sans-serif";
  const stamp = new Date().toLocaleDateString("en-CA", {month:"long", day:"numeric", year:"numeric"});
  x.fillText(stamp, SHARE_W - 64, SHARE_H - FOOT + 72);
  x.textAlign = "left";
  return c;
}

// Where a card actually gets posted. None of these accept an image through a
// link, so the flow is: save the picture, then open the composer with the
// words already written. On a phone the native sheet does carry the image,
// which is why it is offered first there.
const SHARE_TARGETS = [
  {name:"Reddit",   url:function(t,u){ return "https://www.reddit.com/submit?title=" + t + "&url=" + u; }},
  {name:"X",        url:function(t,u){ return "https://twitter.com/intent/tweet?text=" + t + "&url=" + u; }},
  {name:"Bluesky",  url:function(t,u){ return "https://bsky.app/intent/compose?text=" + t + "%20" + u; }},
  {name:"Threads",  url:function(t,u){ return "https://www.threads.net/intent/post?text=" + t + "%20" + u; }},
  {name:"Facebook", url:function(t,u){ return "https://www.facebook.com/sharer/sharer.php?u=" + u; }},
  {name:"LinkedIn", url:function(t,u){ return "https://www.linkedin.com/sharing/share-offsite/?url=" + u; }},
  {name:"WhatsApp", url:function(t,u){ return "https://wa.me/?text=" + t + "%20" + u; }}
];

function sharePlatforms(){
  // No social network accepts an image through a link — every "share to"
  // URL carries text only, which is why LinkedIn showed just the address.
  // So the picture goes on the clipboard first and the composer opens second,
  // leaving a single paste. On a phone the share sheet carries it properly.
  return SHARE_TARGETS.map(function(p){
    return '<button class="sp-link" type="button" data-share="' + p.name + '">'
      + p.name + '</button>';
  }).join("");
}

async function shareTo(name, canvas){
  const target = SHARE_TARGETS.filter(function(p){ return p.name === name; })[0];
  if (!target) return;
  const text = encodeURIComponent("My income portfolio, built with Licentia");
  const url = encodeURIComponent("https://licentia.ca");
  let copied = false;
  try {
    const blob = await new Promise(function(res){ canvas.toBlob(res, "image/png"); });
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
      copied = true;
    }
  } catch(e){}
  window.open(target.url(text, url), "_blank", "noopener");
  return copied;
}

function openShareCard(){
  let showMoney = true;   // the figures are what make the card worth posting
  const wrap = document.createElement("div");
  wrap.className = "share-modal";
  wrap.innerHTML =
    '<div class="sm-card">'
    + '<div class="sm-bar"><b>Share your portfolio</b>'
      + '<button class="sm-x" type="button" aria-label="Close">&times;</button></div>'
    + '<div class="sm-body">'
      + '<div class="sm-preview" id="smPreview"></div>'
      + '<label class="sm-toggle"><input type="checkbox" id="smMoney" checked>'
        + '<span>Include the dollar amounts</span></label>'
      + '<p class="sm-note">Off by default. The card still shows your yield, '
        + 'Your yield, mix and holdings still show.</p>'
      + '<div class="sm-acts">'
        + '<button class="sm-go" id="smSave">Download the image</button>'
        + '<button class="sm-alt" id="smShare">Share&hellip;</button>'
      + '</div>'
      + '<div class="sm-where"><span>Post it to</span>' + sharePlatforms() + '</div>'
      + '<div class="sm-copied"></div>'
      + '<div class="sm-hide">'
      + '</div>'
    + '</div></div>';
  document.body.appendChild(wrap);
  document.body.style.overflow = "hidden";

  function paint(){
    const c = drawShareCard(showMoney);
    const host = wrap.querySelector("#smPreview");
    host.innerHTML = "";
    c.style.width = "100%";
    c.style.height = "auto";
    c.style.borderRadius = "10px";
    host.appendChild(c);
    return c;
  }
  let canvas = paint();

  wrap.querySelector("#smMoney").addEventListener("change", function(e){
    showMoney = e.target.checked;
    canvas = paint();
  });

  function blob(){
    return new Promise(function(res){ canvas.toBlob(res, "image/png"); });
  }

  wrap.querySelector("#smSave").addEventListener("click", async function(){
    const b = await blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "licentia-portfolio.png";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  });

  wrap.addEventListener("click", async function(e){
    const p = e.target.closest && e.target.closest("[data-share]");
    if (!p) return;
    const note = wrap.querySelector(".sm-copied");
    const copied = await shareTo(p.dataset.share, canvas);
    if (note) {
      note.textContent = copied
        ? "Picture copied — paste it into the post."
        : "Save the picture first, then attach it to the post.";
      note.classList.add("on");
    }
  });

  wrap.querySelector("#smShare").addEventListener("click", async function(){
    const b = await blob();
    const file = new File([b], "licentia-portfolio.png", {type:"image/png"});
    // the share sheet is the whole point on a phone; fall back to a download
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try {
        await navigator.share({files:[file], title:"My income portfolio",
          text:"Built with Licentia \u2014 licentia.ca"});
      } catch(e){}
    } else {
      wrap.querySelector("#smSave").click();
    }
  });

  function shut(){
    wrap.remove();
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){ if (e.key === "Escape") shut(); }
  wrap.querySelector(".sm-x").addEventListener("click", shut);
  wrap.addEventListener("click", function(e){ if (e.target === wrap) shut(); });
  document.addEventListener("keydown", onKey);
  requestAnimationFrame(function(){ wrap.classList.add("in"); });
}


// delegated from inside this module, so it works however often the holdings
// panel is redrawn
document.addEventListener("click", function(e){
  const b = e.target.closest && e.target.closest("#shareCard");
  if (!b) return;
  if (!ROWS.length) return;
  openShareCard();
});

// The badge should say where you stand, using the same thresholds as the
// shareable card so the two can never disagree.
// A badge that will not say what it means is just decoration. Clicking it
// explains the standing and what the next one takes.
const TIER_LADDER = [
  {floor: 100000,  name: "Platinum"},
  {floor: 250000,  name: "Platinum Plus"},
  {floor: 500000,  name: "Generational"},
  {floor: 1000000, name: "Diamond"}
];

function tierExplainer(value){
  const t = tierFor(value);
  const money = function(n){ return "$" + Math.round(n).toLocaleString("en-CA"); };
  let title, body;
  if (!t){
    title = "Your standing";
    body = "Holdings worth " + money(value || 0) + " today. Platinum starts at "
      + money(100000) + ".";
  } else {
    title = t.name;
    body = "Your holdings are worth " + money(value) + " today, which puts you at "
      + t.name + ".";
  }
  // the next rung, where there is one
  let next = null;
  for (const rung of TIER_LADDER){
    if ((value || 0) < rung.floor){ next = rung; break; }
  }
  const step = next
    ? money(next.floor - (value || 0)) + " more would reach " + next.name + "."
    : "This is the highest standing.";
  return {title: title, body: body, step: step};
}

function showTierCard(anchor){
  const old = document.getElementById("tierCard");
  if (old){ old.remove(); return; }   // a second click closes it
  let value = 0;
  ROWS.forEach(function(r){
    const d = derive(r);
    if (d && d.value !== null) value += d.value;
  });
  const info = tierExplainer(value);
  const card = document.createElement("div");
  card.id = "tierCard";
  card.className = "tier-card";
  card.innerHTML = "<div class=\"tc-name\">" + info.title + "</div>"
    + "<p class=\"tc-body\">" + info.body + "</p>"
    + "<p class=\"tc-step\">" + info.step + "</p>"
    + "<p class=\"tc-note\">Standing is worked out from what your holdings are "
    + "worth today, and updates with the daily prices.</p>";
  anchor.parentNode.appendChild(card);
  requestAnimationFrame(function(){ card.classList.add("in"); });
  setTimeout(function(){
    document.addEventListener("click", function shut(e){
      if (card.contains(e.target) || anchor.contains(e.target)) return;
      card.remove();
      document.removeEventListener("click", shut);
    });
  }, 0);
}

document.addEventListener("click", function(e){
  const b = e.target.closest && e.target.closest("#tierBadge");
  if (b) showTierCard(b);
});

function paintTierBadge(value){
  const el = document.getElementById("tierBadge");
  if (!el) return;
  const t = tierFor(value);
  el.classList.remove("t-platinum","t-platinum-plus","t-generational","t-diamond");
  if (!t){
    el.textContent = "Account";
    return;
  }
  el.classList.add("t-" + t.name.toLowerCase().replace(/ /g, "-"));
  el.textContent = t.name;
}

function renderTotals(){
  const box = document.getElementById('totals');
  if (!box) return;
  let value = 0, income = 0, spent = 0, valueKnown = false, spentKnown = false;
  ROWS.forEach(function(r){
    const d = derive(r);
    if (d.value !== null){ value += d.value; valueKnown = true; }
    if (d.income !== null && isFinite(d.income)) income += d.income;
    if (d.spent !== null){ spent += d.spent; spentKnown = true; }
  });
  const pl = (valueKnown && spentKnown) ? value - spent : null;
  const plPct = (pl !== null && spent) ? pl / spent * 100 : null;
  const yieldOnValue = (valueKnown && value) ? income / value * 100 : null;
  const yoc = (spentKnown && spent) ? income / spent * 100 : null;
  function cell(v, k, cls){
    // each cell must close itself; without the final </div> they nest and the
    // grid collapses into one stepped column
    return '<div class="tot">'
      + '<div class="v ' + (cls || '') + '">' + v + '</div>'
      + '<div class="k">' + k + '</div>'
      + '</div>';
  }
  box.innerHTML =
    cell(valueKnown ? money(value) : '—', 'portfolio value')
  + cell(income ? money(income) : '—', 'income a year')
  + cell(income ? money(income / 12) : '—', 'income a month')
  + cell(pct(yieldOnValue), 'yield on value')
  + cell(spentKnown ? pct(yoc) : 'add cost basis', 'yield on cost', spentKnown ? '' : 'small')
  + cell(pl === null ? 'add cost basis' : money(pl) + ' (' + pct(plPct) + ')', 'profit',
         pl === null ? 'small' : (pl < 0 ? 'down' : 'up'));

  paintTierBadge(valueKnown ? value : null);
}

async function loadRows(){
  const res = await sb.from('portfolio_holdings')
    .select('id,ticker,shares,cost_basis,created_at')
    .order('created_at', {ascending: true});
  if (res.error){ say(res.error.message, 'bad'); return; }
  ROWS = res.data || [];
}

// Three saved holdings on a free account, unlimited on Pro. Checked before
// the row is written rather than hidden afterwards.
function licentiaHoldingCap(){
  var d = window.LICENTIA_DATA || {};
  if (d.tier === "pro") return true;
  var rows = document.querySelectorAll("[data-holding-row]").length || (window.HOLDINGS||[]).length;
  if (rows < 3) return true;
  var old = document.getElementById("lockModal"); if (old) old.remove();
  var w = document.createElement("div");
  w.id = "lockModal"; w.className = "lock-modal";
  w.innerHTML = '<div class="lm-card"><div class="lm-tick">Three saved</div>'
    + '<div class="lm-copy">A free account keeps three holdings. Licentia Pro keeps as many '
    + 'as you like, with yield on cost and profit across the whole portfolio.</div>'
    + '<div class="lm-row"><a class="lm-go" href="membership.html">See Licentia Pro</a>'
    + '<button class="lm-no" type="button">Not now</button></div></div>';
  document.body.appendChild(w);
  w.querySelector(".lm-no").addEventListener("click", function(){ w.remove(); });
  w.addEventListener("click", function(e){ if (e.target === w) w.remove(); });
  return false;
}
async function addHolding(){
  const btn = document.getElementById('add');
  const ticker = CHOSEN;
  const shares = Number(document.getElementById('sh').value);
  const cbRaw = document.getElementById('cb').value;
  const cost = cbRaw === '' ? null : Number(cbRaw);
  if (!ticker){ say('Pick a fund first — start typing a ticker or name.', 'bad'); return; }
  if (!shares || shares <= 0){ say('Enter a share count above zero.', 'bad'); return; }
  if (!licentiaHoldingCap()) return;
  btn.disabled = true; btn.textContent = 'Adding…';
  const res = await sb.from('portfolio_holdings').insert({
    user_id: session.user.id, ticker: ticker, shares: shares, cost_basis: cost
  }).select();
  btn.disabled = false; btn.textContent = 'Add holding';
  if (res.error){ say(res.error.message, 'bad'); return; }
  document.getElementById('sh').value = '';
  document.getElementById('cb').value = '';
  say(ticker + ' added.', 'good');
  CHOSEN = null;
  buildPicker();
  await loadRows();
  renderRows(); renderTotals();
}


// Editing happens in the cell itself: click the number, type, press Enter.
// A dialog for two numbers would be heavier than the task deserves.

// The table sits in one of two states. Reading is the default, because that
// is what people do most; editing is entered deliberately and left the same
// way, so a stray click can never change a position.
var EDITING = false;
function setEditing(on){
  EDITING = on;
  var box = document.getElementById("rows");
  var btn = document.getElementById("editToggle");
  if (box) box.classList.toggle("editing", on);
  if (btn){
    btn.textContent = on ? "Done" : "Edit holdings";
    btn.classList.toggle("is-on", on);
  }
  if (!on){
    // close any field left open
    var open = document.querySelector("#rows input.cellInput");
    if (open) open.blur();
  }
}
function wireEditToggle(){
  var btn = document.getElementById("editToggle");
  if (!btn || btn.dataset.wired) return;
  btn.dataset.wired = "1";
  btn.addEventListener("click", function(){ setEditing(!EDITING); });
}
function startEdit(el){
  if (!EDITING) return;
  if (el.querySelector('input')) return;
  const id = el.dataset.id, field = el.dataset.field;
  const row = ROWS.filter(function(r){ return String(r.id) === String(id); })[0];
  if (!row) return;
  const current = field === 'shares' ? row.shares
    : (row.cost_basis === null || row.cost_basis === undefined ? '' : row.cost_basis);
  const before = el.innerHTML;

  const input = document.createElement('input');
  input.type = 'number'; input.step = field === 'shares' ? '0.001' : '0.01'; input.min = '0';
  input.className = 'cellInput';
  input.value = current;
  input.placeholder = field === 'shares' ? 'shares' : 'cost';
  el.innerHTML = '';
  el.appendChild(input);
  input.focus(); input.select();

  let done = false;
  function revert(){ if (done) return; done = true; el.innerHTML = before;
    el.querySelectorAll('.cellEdit').forEach(function(){}); }

  async function commit(){
    if (done) return;
    const raw = input.value.trim();
    // shares must be a real positive number; a blank cost simply clears it
    if (field === 'shares'){
      const n = Number(raw);
      if (!raw || !isFinite(n) || n <= 0){ say('Enter a share count above zero.', 'bad'); revert(); return; }
      done = true;
      await saveHolding(id, { shares: n });
    } else {
      const n = raw === '' ? null : Number(raw);
      if (raw !== '' && (!isFinite(n) || n < 0)){ say('Enter a cost of zero or more, or leave it blank.', 'bad'); revert(); return; }
      done = true;
      await saveHolding(id, { cost_basis: n });
    }
  }

  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); commit(); }
    if (e.key === 'Escape'){ e.preventDefault(); revert(); }
  });
  input.addEventListener('blur', commit);
}

// The row is written first, then the table redrawn from what came back, so
// what is on screen is what is actually stored rather than what was typed.

// Confirmation belongs near the thing that changed, not in the form further
// down the page. It announces itself, then leaves without being asked.
function licentiaToast(text){
  var t = document.getElementById("licToast");
  if (!t){
    t = document.createElement("div");
    t.id = "licToast";
    t.className = "lic-toast";
    document.body.appendChild(t);
  }
  t.innerHTML = '<span class="lt-tick">✓</span><span>' + text + '</span>';
  t.classList.remove("show");
  void t.offsetWidth;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
async function saveHolding(id, patch){
  const res = await sb.from('portfolio_holdings').update(patch).eq('id', id).select();
  if (res.error){ say(res.error.message, 'bad'); renderRows(); return; }
  const updated = (res.data || [])[0];
  if (updated){
    ROWS = ROWS.map(function(r){ return String(r.id) === String(id) ? updated : r; });
  }
  renderRows(); renderTotals();
  licentiaToast("Changes saved");
}

async function removeHolding(id){
  // a single row, removed on purpose by its owner — not a bulk delete
  const res = await sb.from('portfolio_holdings').delete().eq('id', id);
  if (res.error){ say(res.error.message, 'bad'); return; }
  await loadRows();
  renderRows(); renderTotals();
}

];

function isPreview(){
  return new URLSearchParams(location.search).get('preview') === '1';
}

async function boot(){
  if (isPreview()){
    const d = await licentiaFundsFetch().then(function(r){ return r.json(); });
    FUNDS = d;
    ROWS = PREVIEW_BOOK.slice();
    portfolioView();
    document.body.classList.add('is-preview');
    return;
  }
  const s = await sb.auth.getSession();
  session = s.data.session;
  if (!session){ gateView(); return; }
  const d = await licentiaFundsFetch().then(function(r){ return r.json(); });
  FUNDS = d;
  const patch = await fetch('data/aum_patch.json?cb=' + Math.random())
    .then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
  Object.keys(patch).forEach(function(t){
    if (FUNDS[t]){ FUNDS[t].stats = FUNDS[t].stats || {};
      if (FUNDS[t].stats.aum_musd == null) FUNDS[t].stats.aum_musd = patch[t].aum_musd; }
  });
  await loadRows();
  portfolioView();
}

sb.auth.onAuthStateChange(function(){ boot(); });
boot();
